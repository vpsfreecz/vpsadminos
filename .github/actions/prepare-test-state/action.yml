name: prepare-test-state
description: Prepare an isolated test-runner state directory for this workflow attempt

outputs:
  state-directory:
    description: Prepared test-runner state directory
    value: ${{ steps.prepare.outputs.state-directory }}

runs:
  using: composite
  steps:
    - id: prepare
      shell: bash
      env:
        TEST_STATE_REPOSITORY_ID: ${{ github.repository_id }}
        TEST_STATE_RUN_ID: ${{ github.run_id }}
        TEST_STATE_RUN_ATTEMPT: ${{ github.run_attempt }}
      run: bash "$GITHUB_ACTION_PATH/prepare-test-state.bash"
