name: summarise-test-logs
description: Append per-test log tails to the GitHub step summary

inputs:
  logs-root:
    description: Directory containing per-test logs
    required: false
    default: /tmp/os-test-runner
  tail-lines:
    description: Number of lines to include from each log file
    required: false
    default: "200"
  max-bytes:
    description: Maximum size of the generated step summary in bytes
    required: false
    default: "921600"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        LOGS_ROOT: ${{ inputs.logs-root }}
        TAIL_LINES: ${{ inputs.tail-lines }}
        MAX_SUMMARY_BYTES: ${{ inputs.max-bytes }}
      run: |
        bash "$GITHUB_ACTION_PATH/summarise-test-logs.bash"
