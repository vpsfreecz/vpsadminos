name: CI

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ci.yml
      - ctstartmenu/**
      - libosctl/**
      - os/**
      - osctl/**
      - osctl-exporter/**
      - osctl-exportfs/**
      - osctl-image/**
      - osctl-repo/**
      - osctld/**
      - osup/**
      - osvm/**
      - svctl/**
      - test-runner/**
      - tests/**
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - ctstartmenu/**
      - libosctl/**
      - os/**
      - osctl/**
      - osctl-exporter/**
      - osctl-exportfs/**
      - osctl-image/**
      - osctl-repo/**
      - osctld/**
      - osup/**
      - osvm/**
      - svctl/**
      - test-runner/**
      - tests/**

jobs:
  build:
    name: Build OS and populate binary cache
    runs-on: self-hosted
    timeout-minutes: 480

    steps:
      - uses: actions/checkout@v6

      - name: Determine branch name
        id: vars
        run: |
          echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> "$GITHUB_OUTPUT"

      - name: Build toplevel closure
        run: |
          make OUTPUT=ci-toplevel toplevel
          echo "BUILD_OUT=$(readlink -f os/result/toplevel)" >> "$GITHUB_ENV"

      - name: Copy toplevel closure to binary cache
        env:
          VPSADMINOS_CACHE_SSH_KEY: ${{ secrets.VPSADMINOS_CACHE_SSH_KEY }}
        run: |
          install -m 600 -D <(echo "$VPSADMINOS_CACHE_SSH_KEY") .ssh/cache_id
          NIX_SSHOPTS="-i .ssh/cache_id -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" nix-copy-closure --to push@cache.int.vpsadminos.org "$BUILD_OUT"

      - name: Add new profile generation
        env:
          BRANCH: ${{ steps.vars.outputs.branch }}
        run: |
          ssh -i .ssh/cache_id \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              push@cache.int.vpsadminos.org \
              sudo push-ci-generation "$BRANCH" "$BUILD_OUT"

  test:
    name: Run test suite
    needs: build
    runs-on: self-hosted
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v6

      - name: Run tests
        id: run-tests
        timeout-minutes: 260
        run: |
          set -o pipefail
          ./test-runner.sh test \
            --test-config tests/test-configs/ci.nix \
            -f \
            --jobs auto \
            -t ci | tee test.log

      - name: Evaluate test results
        if: always()
        uses: vpsfreecz/vpsadminos/.github/actions/evaluate-test-results@staging
        with:
          log-file: test.log

      - name: Summarise test logs
        if: always()
        uses: vpsfreecz/vpsadminos/.github/actions/summarise-test-logs@staging

      - name: Upload full test logs
        if: failure()
        uses: vpsfreecz/vpsadminos/.github/actions/upload-test-logs@staging
