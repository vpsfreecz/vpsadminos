name: CI

on:
  workflow_dispatch:
    inputs:
      stop_on_failure:
        description: Stop scheduling after the first unexpected result
        required: true
        default: false
        type: boolean
  push:
    paths:
      - .github/workflows/ci.yml
      - flake.nix
      - ctstartmenu/**
      - libosctl/**
      - os/**
      - osctl/**
      - osctl-exporter/**
      - osctl-exportfs/**
      - osctl-image/**
      - osctl-repo/**
      - osctld/**
      - osup/**
      - osvm/**
      - svctl/**
      - test-runner/**
      - tests/**
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - flake.nix
      - ctstartmenu/**
      - libosctl/**
      - os/**
      - osctl/**
      - osctl-exporter/**
      - osctl-exportfs/**
      - osctl-image/**
      - osctl-repo/**
      - osctld/**
      - osup/**
      - osvm/**
      - svctl/**
      - test-runner/**
      - tests/**

jobs:
  build:
    name: Build OS and populate binary cache
    runs-on: self-hosted
    timeout-minutes: 480

    steps:
      - uses: actions/checkout@v7

      - name: Check NixOS container image repository module
        run: nix eval --impure --raw --file tests/nixos-container-image-repository-eval.nix

      - name: Check NixOS disk image reuse
        run: nix build .#checks.x86_64-linux.nixos-disk-image-reuse --no-link

      - name: Check vpsAdminOS disk image reuse
        run: nix build .#checks.x86_64-linux.vpsadminos-disk-image-reuse --no-link

      - name: Determine branch name
        id: vars
        run: |
          echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> "$GITHUB_OUTPUT"

      - name: Build toplevel closure
        run: |
          make OUTPUT=ci-toplevel toplevel
          build_out=$(readlink -e os/result/toplevel)
          livepatch_out=$(readlink -e "$build_out/livepatch-6.12.95")
          echo "BUILD_OUT=$build_out" >> "$GITHUB_ENV"
          echo "LIVEPATCH_BUILD_OUT=$livepatch_out" >> "$GITHUB_ENV"

      - name: Upload production livepatch package
        uses: actions/upload-artifact@v7
        with:
          name: production-livepatch-6.12.95-${{ github.run_id }}
          path: ${{ env.LIVEPATCH_BUILD_OUT }}/
          include-hidden-files: true
          if-no-files-found: error

      - name: Copy toplevel closure to binary cache
        env:
          VPSADMINOS_CACHE_SSH_KEY: ${{ secrets.VPSADMINOS_CACHE_SSH_KEY }}
        run: |
          install -m 600 -D <(echo "$VPSADMINOS_CACHE_SSH_KEY") .ssh/cache_id
          NIX_SSHOPTS="-i .ssh/cache_id -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" nix-copy-closure --to push@cache.int.vpsadminos.org "$BUILD_OUT"

      - name: Add new profile generation
        env:
          BRANCH: ${{ steps.vars.outputs.branch }}
        run: |
          ssh -i .ssh/cache_id \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              push@cache.int.vpsadminos.org \
              sudo push-ci-generation "$BRANCH" "$BUILD_OUT"

  test:
    name: Run test suite
    needs: build
    runs-on: self-hosted
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v7

      - name: Prepare test state
        id: prepare-tests
        uses: ./.github/actions/prepare-test-state

      - name: Run tests
        id: run-tests
        # Cold kernel/livepatch builds can consume most of four hours; the
        # NFS guest cases then need over an hour. Keep time for log upload.
        timeout-minutes: 350
        env:
          STOP_ON_FAILURE: ${{ github.event.inputs.stop_on_failure || 'false' }}
        run: |
          set -o pipefail

          args=(
            test
            --test-config tests/test-configs/ci.nix
            --state-dir "$TEST_RUNNER_STATE_DIR"
            -f
            --jobs auto
            -t ci
          )

          if [[ "$STOP_ON_FAILURE" == "true" ]]; then
            args+=(--stop-on-failure)
          fi

          ./test-runner.sh "${args[@]}" | tee "$TEST_RUNNER_STATE_DIR/test.log"

      - name: Upload full test logs
        id: upload-test-logs
        if: >-
          (failure() || cancelled()) &&
          steps.prepare-tests.outcome == 'success' &&
          steps.run-tests.outcome != 'skipped'
        uses: ./.github/actions/upload-test-logs
        with:
          paths: |
            ${{ steps.prepare-tests.outputs.state-directory }}/**/*.log
            ${{ steps.prepare-tests.outputs.state-directory }}/**/*.txt

      - name: Evaluate test results
        if: >-
          always() &&
          steps.prepare-tests.outcome == 'success' &&
          steps.run-tests.outcome != 'skipped'
        uses: ./.github/actions/evaluate-test-results
        with:
          log-file: ${{ steps.prepare-tests.outputs.state-directory }}/test.log

      - name: Summarise test logs
        if: >-
          always() &&
          steps.prepare-tests.outcome == 'success' &&
          steps.run-tests.outcome != 'skipped'
        uses: ./.github/actions/summarise-test-logs
        with:
          logs-root: ${{ steps.prepare-tests.outputs.state-directory }}

      - name: Cleanup test state
        if: always()
        uses: ./.github/actions/cleanup-test-state
        with:
          state-directory: ${{ steps.prepare-tests.outputs.state-directory }}
          prepare-outcome: ${{ steps.prepare-tests.outcome }}
          test-outcome: ${{ steps.run-tests.outcome }}
          upload-outcome: ${{ steps.upload-test-logs.outcome }}

  livepatch-lifecycle:
    name: Livepatch lifecycle (${{ matrix.label }})
    needs: build
    runs-on:
      group: vpsAdminOS runners
      labels: "${{ matrix.runner }}"
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          - vendor: amd
            runner: amd-livepatch
            label: amd
            tag: livepatch-amd
          - vendor: intel
            runner: intel-kvm
            label: intel
            tag: livepatch-intel
          - vendor: amd
            runner: amd-livepatch
            label: amd-fresh
            tag: livepatch-qualification-amd-fresh
          - vendor: amd
            runner: amd-livepatch
            label: amd-scale-aged-v5
            tag: livepatch-qualification-amd-scale-aged-v5
            large: true
          - vendor: amd
            runner: amd-livepatch
            label: amd-scale-aged-v6
            tag: livepatch-qualification-amd-scale-aged-v6
            large: true
          - vendor: amd
            runner: amd-livepatch
            label: amd-low-memory-v5
            tag: livepatch-qualification-amd-low-memory-v5
          - vendor: amd
            runner: amd-livepatch
            label: amd-low-memory-v6
            tag: livepatch-qualification-amd-low-memory-v6
          - vendor: intel
            runner: intel-kvm
            label: intel-representative-v5
            tag: livepatch-qualification-intel-representative-v5
          - vendor: intel
            runner: intel-kvm
            label: intel-representative-v6
            tag: livepatch-qualification-intel-representative-v6

    steps:
      - uses: actions/checkout@v7

      - name: Prepare test state
        id: prepare-tests
        uses: ./.github/actions/prepare-test-state

      - name: Run livepatch lifecycle tests
        id: run-tests
        # Include main/security checks on AMD and perf on both vendors, using
        # the existing tag selectors. Keep ten minutes for logs and cleanup.
        timeout-minutes: 350
        env:
          VPSADMINOS_ENABLE_LIVEPATCH_TEST: "1"
        run: |
          set -euo pipefail

          # Prepare normal repository fixtures, preserving every main/perf
          # identity assertion. The expected hash is a reviewed source pin,
          # not a checksum computed from the module being tested.
          unset VPSADMINOS_LIVEPATCH_SINGLE_SERIES_MODULE \
            VPSADMINOS_LIVEPATCH_MODULE_NAME VPSADMINOS_LIVEPATCH_EXAMPLE_FILTER \
            VPSADMINOS_ONLY_LIVEPATCH_TEST
          nix eval --impure --raw --expr \
            '(import ./tests/fixtures/livepatch {}).correctedSha256' \
            > "$TEST_RUNNER_STATE_DIR/livepatch-corrected-sha256.txt"
          export VPSADMINOS_LIVEPATCH_CORRECTED_SHA256="$(cat "$TEST_RUNNER_STATE_DIR/livepatch-corrected-sha256.txt")"
          nix-build tests/fixtures/livepatch -A corrected \
            --out-link "$TEST_RUNNER_STATE_DIR/livepatch-corrected" \
            > "$TEST_RUNNER_STATE_DIR/livepatch-corrected-path.txt"
          nix-build tests/fixtures/livepatch -A releasedV5 \
            --out-link "$TEST_RUNNER_STATE_DIR/livepatch-released-v5" \
            > "$TEST_RUNNER_STATE_DIR/livepatch-released-v5-path.txt"
          nix-build tests/fixtures/livepatch -A shippedV6 \
            --out-link "$TEST_RUNNER_STATE_DIR/livepatch-predecessor-v6" \
            > "$TEST_RUNNER_STATE_DIR/livepatch-predecessor-v6-path.txt"
          export VPSADMINOS_LIVEPATCH_CORRECTED_MODULE="$(cat "$TEST_RUNNER_STATE_DIR/livepatch-corrected-path.txt")"
          export VPSADMINOS_LIVEPATCH_RELEASED_V5_MODULE="$(cat "$TEST_RUNNER_STATE_DIR/livepatch-released-v5-path.txt")"
          export VPSADMINOS_LIVEPATCH_PREDECESSOR_MODULE="$(cat "$TEST_RUNNER_STATE_DIR/livepatch-predecessor-v6-path.txt")"

          args=(
            test
            --state-dir "$TEST_RUNNER_STATE_DIR"
            --fresh
            --jobs 1
            --tag "${{ matrix.tag }}"
          )

          if [[ "${{ matrix.large || false }}" == "true" ]]; then
            # Step 25 requires 128 *guest* vCPUs. Admit one such VM using
            # the normal runner's CPU-only oversubscription option. Keep
            # memory admission unchanged; never pretend these are 128
            # physical host CPUs or lower the guest/task requirements.
            host_cpus=$(nproc)
            cpu_factor=$(((128 + host_cpus - 1) / host_cpus))
            printf '128 guest vCPUs on %s host-visible CPUs; factor=%s\n' \
              "$host_cpus" "$cpu_factor"
            args+=(--max-cpus 128 --cpu-overcommit "$cpu_factor")
          fi

          ./test-runner.sh "${args[@]}" | tee "$TEST_RUNNER_STATE_DIR/test.log"

      # Keep producer module checksums available even when every case passes.
      - name: Upload full test logs
        id: upload-test-logs
        if: >-
          always() &&
          steps.prepare-tests.outcome == 'success' &&
          steps.run-tests.outcome != 'skipped'
        uses: ./.github/actions/upload-test-logs
        with:
          name: livepatch-lifecycle-${{ matrix.label }}-logs-${{ github.run_id }}
          paths: |
            ${{ steps.prepare-tests.outputs.state-directory }}/**/*.log
            ${{ steps.prepare-tests.outputs.state-directory }}/**/*.txt

      - name: Evaluate test results
        if: >-
          always() &&
          steps.prepare-tests.outcome == 'success' &&
          steps.run-tests.outcome != 'skipped'
        uses: ./.github/actions/evaluate-test-results
        with:
          log-file: ${{ steps.prepare-tests.outputs.state-directory }}/test.log

      - name: Summarise test logs
        if: >-
          always() &&
          steps.prepare-tests.outcome == 'success' &&
          steps.run-tests.outcome != 'skipped'
        uses: ./.github/actions/summarise-test-logs
        with:
          logs-root: ${{ steps.prepare-tests.outputs.state-directory }}

      - name: Cleanup test state
        if: always()
        uses: ./.github/actions/cleanup-test-state
        with:
          state-directory: ${{ steps.prepare-tests.outputs.state-directory }}
          prepare-outcome: ${{ steps.prepare-tests.outcome }}
          test-outcome: ${{ steps.run-tests.outcome }}
          upload-outcome: ${{ steps.upload-test-logs.outcome }}
