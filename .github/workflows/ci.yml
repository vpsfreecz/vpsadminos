name: CI

on:
  workflow_dispatch:
    inputs:
      stop_on_failure:
        description: Stop scheduling after the first unexpected result
        required: true
        default: false
        type: boolean
  push:
    paths:
      - .github/workflows/ci.yml
      - ctstartmenu/**
      - libosctl/**
      - os/**
      - osctl/**
      - osctl-exporter/**
      - osctl-exportfs/**
      - osctl-image/**
      - osctl-repo/**
      - osctld/**
      - osup/**
      - osvm/**
      - svctl/**
      - test-runner/**
      - tests/**
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - ctstartmenu/**
      - libosctl/**
      - os/**
      - osctl/**
      - osctl-exporter/**
      - osctl-exportfs/**
      - osctl-image/**
      - osctl-repo/**
      - osctld/**
      - osup/**
      - osvm/**
      - svctl/**
      - test-runner/**
      - tests/**

jobs:
  build:
    name: Build OS and populate binary cache
    runs-on: self-hosted
    timeout-minutes: 480

    steps:
      - uses: actions/checkout@v7

      - name: Determine branch name
        id: vars
        run: |
          echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> "$GITHUB_OUTPUT"

      - name: Build toplevel closure
        run: |
          make OUTPUT=ci-toplevel toplevel
          echo "BUILD_OUT=$(readlink -f os/result/toplevel)" >> "$GITHUB_ENV"

      - name: Copy toplevel closure to binary cache
        env:
          VPSADMINOS_CACHE_SSH_KEY: ${{ secrets.VPSADMINOS_CACHE_SSH_KEY }}
        run: |
          install -m 600 -D <(echo "$VPSADMINOS_CACHE_SSH_KEY") .ssh/cache_id
          NIX_SSHOPTS="-i .ssh/cache_id -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" nix-copy-closure --to push@cache.int.vpsadminos.org "$BUILD_OUT"

      - name: Add new profile generation
        env:
          BRANCH: ${{ steps.vars.outputs.branch }}
        run: |
          ssh -i .ssh/cache_id \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              push@cache.int.vpsadminos.org \
              sudo push-ci-generation "$BRANCH" "$BUILD_OUT"

  test:
    name: Run test suite
    needs: build
    runs-on: self-hosted
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v7

      - name: Prepare test state
        id: prepare-tests
        uses: ./.github/actions/prepare-test-state

      - name: Run tests
        id: run-tests
        timeout-minutes: 260
        env:
          STOP_ON_FAILURE: ${{ github.event.inputs.stop_on_failure || 'false' }}
        run: |
          set -o pipefail

          args=(
            test
            --test-config tests/test-configs/ci.nix
            --state-dir "$TEST_RUNNER_STATE_DIR"
            -f
            --jobs auto
            -t ci
          )

          if [[ "$STOP_ON_FAILURE" == "true" ]]; then
            args+=(--stop-on-failure)
          fi

          ./test-runner.sh "${args[@]}" | tee "$TEST_RUNNER_STATE_DIR/test.log"

      - name: Upload full test logs
        id: upload-test-logs
        if: >-
          (failure() || cancelled()) &&
          steps.prepare-tests.outcome == 'success' &&
          steps.run-tests.outcome != 'skipped'
        uses: ./.github/actions/upload-test-logs
        with:
          paths: |
            ${{ steps.prepare-tests.outputs.state-directory }}/**/*.log
            ${{ steps.prepare-tests.outputs.state-directory }}/**/*.txt

      - name: Evaluate test results
        if: >-
          always() &&
          steps.prepare-tests.outcome == 'success' &&
          steps.run-tests.outcome != 'skipped'
        uses: ./.github/actions/evaluate-test-results
        with:
          log-file: ${{ steps.prepare-tests.outputs.state-directory }}/test.log

      - name: Summarise test logs
        if: >-
          always() &&
          steps.prepare-tests.outcome == 'success' &&
          steps.run-tests.outcome != 'skipped'
        uses: ./.github/actions/summarise-test-logs
        with:
          logs-root: ${{ steps.prepare-tests.outputs.state-directory }}

      - name: Cleanup test state
        if: always()
        uses: ./.github/actions/cleanup-test-state
        with:
          state-directory: ${{ steps.prepare-tests.outputs.state-directory }}
          prepare-outcome: ${{ steps.prepare-tests.outcome }}
          test-outcome: ${{ steps.run-tests.outcome }}
          upload-outcome: ${{ steps.upload-test-logs.outcome }}
