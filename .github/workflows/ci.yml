name: CI
run-name: CI (${{ inputs.test_suite || 'ci' }})

env:
  VPSADMINOS_CONFIG: >-
    ${{ (inputs.test_suite == 'ci-unstable' || inputs.test_suite == 'zfs-full' || github.ref == 'refs/heads/snajpa-6.18' || github.head_ref == 'snajpa-6.18') && format('{0}/os/configs/unstable.nix', github.workspace) || '' }}

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: Native suite (unstable and ZTS use the selected vpsAdminOS 6.18 tuple)
        required: true
        default: ci
        type: choice
        options:
          - ci
          - ci-unstable
          - zfs-full
      stop_on_failure:
        description: Stop scheduling after the first unexpected result
        required: true
        default: false
        type: boolean
  push:
    paths:
      - .github/workflows/ci.yml
      - flake.nix
      - ctstartmenu/**
      - libosctl/**
      - os/**
      - osctl/**
      - osctl-exporter/**
      - osctl-exportfs/**
      - osctl-image/**
      - osctl-repo/**
      - osctld/**
      - osup/**
      - osvm/**
      - svctl/**
      - test-runner/**
      - tests/**
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - flake.nix
      - ctstartmenu/**
      - libosctl/**
      - os/**
      - osctl/**
      - osctl-exporter/**
      - osctl-exportfs/**
      - osctl-image/**
      - osctl-repo/**
      - osctld/**
      - osup/**
      - osvm/**
      - svctl/**
      - test-runner/**
      - tests/**

jobs:
  build:
    name: Build OS and populate binary cache
    runs-on: self-hosted
    timeout-minutes: 480

    steps:
      - uses: actions/checkout@v7

      - name: Check NixOS container image repository module
        run: nix eval --impure --raw --file tests/nixos-container-image-repository-eval.nix

      - name: Check NixOS disk image reuse
        run: nix build .#checks.x86_64-linux.nixos-disk-image-reuse --no-link

      - name: Check vpsAdminOS disk image reuse
        run: nix build .#checks.x86_64-linux.vpsadminos-disk-image-reuse --no-link

      - name: Determine branch name
        id: vars
        run: |
          echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> "$GITHUB_OUTPUT"

      - name: Build toplevel closure
        run: |
          make OUTPUT=ci-toplevel toplevel
          echo "BUILD_OUT=$(readlink -f os/result/toplevel)" >> "$GITHUB_ENV"

      - name: Copy toplevel closure to binary cache
        env:
          VPSADMINOS_CACHE_SSH_KEY: ${{ secrets.VPSADMINOS_CACHE_SSH_KEY }}
        run: |
          install -m 600 -D <(echo "$VPSADMINOS_CACHE_SSH_KEY") .ssh/cache_id
          NIX_SSHOPTS="-i .ssh/cache_id -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" nix-copy-closure --to push@cache.int.vpsadminos.org "$BUILD_OUT"

      - name: Add new profile generation
        env:
          BRANCH: ${{ steps.vars.outputs.branch }}
        run: |
          ssh -i .ssh/cache_id \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              push@cache.int.vpsadminos.org \
              sudo push-ci-generation "$BRANCH" "$BUILD_OUT"

  test:
    name: Run test suite
    needs: build
    runs-on: self-hosted
    # Full ZTS takes about ten hours, plus closure construction. Leave time
    # for artifact upload before the job's 24-hour GITHUB_TOKEN lifetime.
    timeout-minutes: ${{ inputs.test_suite == 'zfs-full' && 1380 || 240 }}

    steps:
      - uses: actions/checkout@v7

      - name: Prepare test state
        id: prepare-tests
        uses: ./.github/actions/prepare-test-state

      - name: Run tests
        id: run-tests
        env:
          STOP_ON_FAILURE: ${{ github.event.inputs.stop_on_failure || 'false' }}
          TEST_SUITE: ${{ inputs.test_suite || 'ci' }}
        run: |
          set -o pipefail

          printf 'Native suite: %s\nConfiguration: %s\n' "$TEST_SUITE" "$VPSADMINOS_CONFIG"
          git show --no-patch --format='Source: %H%nTree: %T' HEAD
          cat os/packages/linux/available-kernels.nix

          args=(
            test
            --test-config tests/test-configs/ci.nix
            --state-dir "$TEST_RUNNER_STATE_DIR"
            -f
          )

          case "$TEST_SUITE" in
            ci|ci-unstable)
              args+=(--jobs auto -t ci)
              ;;
            zfs-full)
              # Complete ZTS in the native VM, not a focused body or debug stage.
              unset VPSADMINOS_LOCAL_ZFS_STAGE VPSADMINOS_ZFS_FULL_USER_SOURCE
              unset VPSADMINOS_ZFS_FULL_TEST
              export VPSADMINOS_ZFS_FULL_PROFILE=full
              export VPSADMINOS_ZFS_FULL_USE_BUILTIN=1
              export VPSADMINOS_ZFS_FULL_RUNFILES=common.run,linux.run
              export VPSADMINOS_ZFS_FULL_TAGS=functional
              args+=(--jobs 1 -t zfs-full zfs/full-suite)
              ;;
            *)
              echo "::error::Unknown native test suite: $TEST_SUITE"
              exit 1
              ;;
          esac

          if [[ "$STOP_ON_FAILURE" == "true" ]]; then
            args+=(--stop-on-failure)
          fi

          ./test-runner.sh "${args[@]}" | tee "$TEST_RUNNER_STATE_DIR/test.log"

      - name: Upload full test logs
        id: upload-test-logs
        if: >-
          (failure() || cancelled() || inputs.test_suite == 'zfs-full' || inputs.test_suite == 'ci-unstable') &&
          steps.prepare-tests.outcome == 'success' &&
          steps.run-tests.outcome != 'skipped'
        uses: ./.github/actions/upload-test-logs
        with:
          name: os-test-logs-${{ github.run_id }}-${{ github.run_attempt }}-native
          paths: |
            ${{ steps.prepare-tests.outputs.state-directory }}/**/*.log
            ${{ steps.prepare-tests.outputs.state-directory }}/**/*.txt

      - name: Evaluate test results
        if: >-
          always() &&
          steps.prepare-tests.outcome == 'success' &&
          steps.run-tests.outcome != 'skipped'
        uses: ./.github/actions/evaluate-test-results
        with:
          log-file: ${{ steps.prepare-tests.outputs.state-directory }}/test.log

      - name: Summarise test logs
        if: >-
          always() &&
          steps.prepare-tests.outcome == 'success' &&
          steps.run-tests.outcome != 'skipped'
        uses: ./.github/actions/summarise-test-logs
        with:
          logs-root: ${{ steps.prepare-tests.outputs.state-directory }}

      - name: Cleanup test state
        # Successful qualification still needs its complete uploaded evidence.
        if: >-
          always() &&
          ((inputs.test_suite != 'zfs-full' && inputs.test_suite != 'ci-unstable') ||
          steps.upload-test-logs.outcome == 'success')
        uses: ./.github/actions/cleanup-test-state
        with:
          state-directory: ${{ steps.prepare-tests.outputs.state-directory }}
          prepare-outcome: ${{ steps.prepare-tests.outcome }}
          test-outcome: ${{ steps.run-tests.outcome }}
          upload-outcome: ${{ steps.upload-test-logs.outcome }}

  livepatch-lifecycle:
    name: Livepatch lifecycle (${{ matrix.vendor }})
    # Complete CI selections retain these jobs; ZTS-only does not repeat them.
    if: ${{ inputs.test_suite != 'zfs-full' }}
    needs: build
    runs-on:
      group: vpsAdminOS runners
      labels: "${{ matrix.runner }}"
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - vendor: amd
            runner: amd-livepatch
          - vendor: intel
            runner: intel-kvm

    steps:
      - uses: actions/checkout@v7

      - name: Prepare test state
        id: prepare-tests
        uses: ./.github/actions/prepare-test-state

      - name: Run livepatch lifecycle tests
        id: run-tests
        timeout-minutes: 170
        run: |
          set -o pipefail

          ./test-runner.sh test \
            --state-dir "$TEST_RUNNER_STATE_DIR" \
            --fresh \
            --jobs 1 \
            --tag "livepatch-${{ matrix.vendor }}" \
            | tee "$TEST_RUNNER_STATE_DIR/test.log"

      - name: Upload full test logs
        id: upload-test-logs
        if: >-
          (failure() || cancelled()) &&
          steps.prepare-tests.outcome == 'success' &&
          steps.run-tests.outcome != 'skipped'
        uses: ./.github/actions/upload-test-logs
        with:
          name: os-test-logs-${{ github.run_id }}-${{ github.run_attempt }}-livepatch-${{ matrix.vendor }}
          paths: |
            ${{ steps.prepare-tests.outputs.state-directory }}/**/*.log
            ${{ steps.prepare-tests.outputs.state-directory }}/**/*.txt

      - name: Evaluate test results
        if: >-
          always() &&
          steps.prepare-tests.outcome == 'success' &&
          steps.run-tests.outcome != 'skipped'
        uses: ./.github/actions/evaluate-test-results
        with:
          log-file: ${{ steps.prepare-tests.outputs.state-directory }}/test.log

      - name: Summarise test logs
        if: >-
          always() &&
          steps.prepare-tests.outcome == 'success' &&
          steps.run-tests.outcome != 'skipped'
        uses: ./.github/actions/summarise-test-logs
        with:
          logs-root: ${{ steps.prepare-tests.outputs.state-directory }}

      - name: Cleanup test state
        if: always()
        uses: ./.github/actions/cleanup-test-state
        with:
          state-directory: ${{ steps.prepare-tests.outputs.state-directory }}
          prepare-outcome: ${{ steps.prepare-tests.outcome }}
          test-outcome: ${{ steps.run-tests.outcome }}
          upload-outcome: ${{ steps.upload-test-logs.outcome }}
