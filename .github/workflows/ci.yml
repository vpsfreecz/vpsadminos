name: CI
run-name: Warm full native suite, no-prebuild then prebuild

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prebuild-benchmark
  cancel-in-progress: false

jobs:
  compare:
    name: Matched warm native suite timing
    runs-on: self-hosted
    timeout-minutes: 1380
    env:
      VPSADMINOS_CONFIG: ""
    steps:
      - name: Check out benchmark harness
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: benchmark-harness
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: maintenance.auto
          GIT_CONFIG_VALUE_0: "false"

      - name: Check out exact product source
        uses: actions/checkout@v7
        with:
          ref: a2ccd72d08dc67f678d7f115a92ed5eeca50c1a1
          path: product
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: maintenance.auto
          GIT_CONFIG_VALUE_0: "false"

      - name: Prepare isolated benchmark state
        id: prepare
        uses: ./benchmark-harness/.github/actions/prepare-test-state

      - name: Prepare environment, warm closures and measure both legs
        id: measure
        timeout-minutes: 1350
        working-directory: product
        env:
          BENCHMARK_HARNESS: ${{ github.workspace }}/benchmark-harness/.github/workflows/scripts/prebuild_benchmark.rb
          BENCHMARK_HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Environment and the native extension are prepared outside both timers.
          nix develop .#test-runner --command bash -c '
            cd libosctl/ext/libosctl
            ruby extconf.rb
            make
            cp native.so ../../lib/libosctl/native.so
          ' > "$TEST_RUNNER_STATE_DIR/environment.log" 2>&1
          nix develop .#test-runner --command bundle exec ruby "$BENCHMARK_HARNESS" \
            "$PWD" "$TEST_RUNNER_STATE_DIR" \
            2>&1 | tee "$TEST_RUNNER_STATE_DIR/benchmark.log"

      - name: Upload timings and complete text logs
        id: upload
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: prebuild-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.prepare.outputs.state-directory }}/**/*.log
            ${{ steps.prepare.outputs.state-directory }}/**/*.txt
            ${{ steps.prepare.outputs.state-directory }}/**/*.json
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 14

      - name: Retain benchmark diagnostics
        if: always()
        env:
          BENCHMARK_ROOT: ${{ steps.prepare.outputs.state-directory }}
        run: |
          printf 'Benchmark state retained for configured host retention: %s\n' "$BENCHMARK_ROOT"
          echo 'Guest teardown is part of each measured native test-runner invocation.'
