name: RuboCop

on:
  push:
    paths:
      - "**/*.rb"
      - "**/*.gemspec"
      - "Gemfile*"
      - ".rubocop*"
      - ".github/workflows/rubocop.yml"
  pull_request:
    paths:
      - "**/*.rb"
      - "**/*.gemspec"
      - "Gemfile*"
      - ".rubocop*"
      - ".github/workflows/rubocop.yml"

jobs:
  rubocop:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Ruby + Bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Run RuboCop
        shell: bash
        run: |
          bundle exec rubocop --parallel --force-exclusion
