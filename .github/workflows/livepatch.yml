name: Generic livepatch qualification

on:
  workflow_call:
    inputs:
      kernel-versions:
        description: Optional exact target kernels, one per line
        required: false
        type: string
        default: ''
      resume-source-run-id:
        description: Completed qualification source run ID
        required: false
        type: string
        default: ''
      resume-source-run-attempt:
        description: Completed qualification source run attempt
        required: false
        type: string
        default: ''
      resume-source-revision:
        description: Exact tested 40-hex source revision
        required: false
        type: string
        default: ''
      resume-plan-sha256:
        description: Exact source plan.json SHA-256
        required: false
        type: string
        default: ''
      resume-capture-sha256:
        description: Exact source capture.json SHA-256
        required: false
        type: string
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  discover:
    name: Discover livepatch qualification
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      selected-sets: ${{ steps.plan.outputs.selected-sets }}
      source-revision: ${{ steps.plan.outputs.source-revision }}
      affected-matrix: ${{ steps.plan.outputs.affected-matrix }}
      affected-selected-sets: ${{ steps.plan.outputs.affected-selected-sets }}
      resume-mode: ${{ steps.resume.outputs.enabled }}
      imported-rows: ${{ steps.plan.outputs.imported-rows }}

    steps:
      - name: Validate qualification resume provenance
        id: resume
        uses: actions/github-script@v9
        env:
          CONTROLLER_REVISION: ${{ github.sha }}
          EXPECTED_CAPTURE_ARCHIVE_SHA256: 9527e0907ce8ecc45b0e574db3b5168671da34046c8d0c946b0e3dc65b579526
          EXPECTED_IMPORTED_RESULT_ARCHIVE_SHA256: 85aec18ea28f1ecbc74f2308c3704efab45e14db782b5b0bde2c3bfdd3a132e5
          EXPECTED_IMPORTED_ROW_ID: 6.12.113.4--set-vendor-aged-transition--amd
          EXPECTED_PLAN_ARCHIVE_SHA256: 0cf4af028d6469619f1ab68d6169720ba991332651540a88eb70d4d9dff43c83
          EXPECTED_REPOSITORY: vpsfreecz/vpsadminos
          KERNEL_VERSIONS: ${{ inputs.kernel-versions }}
          RESUME_CAPTURE_SHA256: ${{ inputs['resume-capture-sha256'] }}
          RESUME_PLAN_SHA256: ${{ inputs['resume-plan-sha256'] }}
          RESUME_SOURCE_REVISION: ${{ inputs['resume-source-revision'] }}
          RESUME_SOURCE_RUN_ATTEMPT: ${{ inputs['resume-source-run-attempt'] }}
          RESUME_SOURCE_RUN_ID: ${{ inputs['resume-source-run-id'] }}
        with:
          github-token: ${{ github.token }}
          script: |
            const inputs = {
              runId: process.env.RESUME_SOURCE_RUN_ID,
              runAttempt: process.env.RESUME_SOURCE_RUN_ATTEMPT,
              sourceRevision: process.env.RESUME_SOURCE_REVISION,
              planSha256: process.env.RESUME_PLAN_SHA256,
              captureSha256: process.env.RESUME_CAPTURE_SHA256,
            };
            const supplied = Object.values(inputs).filter((value) => value !== '').length;
            if (supplied === 0) {
              core.setOutput('enabled', 'false');
              return;
            }
            if (supplied !== Object.keys(inputs).length) {
              core.setFailed('qualification resume inputs must be supplied all or none');
              return;
            }
            if (context.eventName !== 'workflow_dispatch') {
              core.setFailed('qualification resume is available only to workflow_dispatch');
              return;
            }
            if (context.repo.owner + '/' + context.repo.repo !== process.env.EXPECTED_REPOSITORY) {
              core.setFailed('qualification resume repository is not authorized');
              return;
            }
            if (process.env.KERNEL_VERSIONS !== '') {
              core.setFailed('qualification resume cannot combine with a kernel selector');
              return;
            }
            if (!/^[1-9][0-9]*$/.test(inputs.runId) ||
                !/^[1-9][0-9]*$/.test(inputs.runAttempt) ||
                !/^[0-9a-f]{40}$/.test(inputs.sourceRevision) ||
                !/^[0-9a-f]{64}$/.test(inputs.planSha256) ||
                !/^[0-9a-f]{64}$/.test(inputs.captureSha256)) {
              core.setFailed('qualification resume input form is invalid');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = Number(inputs.runId);
            const attempt = Number(inputs.runAttempt);
            const sourceRun = await github.request(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}',
              {owner, repo, run_id: runId, attempt_number: attempt},
            );
            const expectedWorkflow = await github.request(
              'GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}',
              {owner, repo, workflow_id: 'livepatch-qualification.yml'},
            );
            const run = sourceRun.data;
            if (run.id !== runId || run.run_attempt !== attempt || run.status !== 'completed' ||
                run.workflow_id !== expectedWorkflow.data.id ||
                run.head_repository?.full_name !== process.env.EXPECTED_REPOSITORY ||
                run.head_sha !== inputs.sourceRevision) {
              core.setFailed('source run provenance does not match the resume request');
              return;
            }

            async function collect(route, key, perPage = 100) {
              const rows = [];
              for (let page = 1; page <= 100; page += 1) {
                const response = await github.request(route, {
                  owner,
                  repo,
                  run_id: runId,
                  attempt_number: attempt,
                  per_page: perPage,
                  page,
                });
                const batch = response.data[key];
                if (!Array.isArray(batch)) {
                  throw new Error(`GitHub response has no ${key} array`);
                }
                rows.push(...batch);
                if (batch.length < perPage) return rows;
              }
              throw new Error(`GitHub ${key} pagination exceeded the bounded limit`);
            }

            const jobs = await collect(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs',
              'jobs',
              25,
            );
            if (jobs.some((job) =>
              job.name.startsWith('Ordinary CI on ') && job.conclusion === 'success')) {
              core.setFailed('source run contains a successful ordinary row outside the resume interface');
              return;
            }

            const artifacts = await collect(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts',
              'artifacts',
            );
            const planName = `livepatch-plan-${inputs.runId}-${inputs.runAttempt}`;
            const captureName = `livepatch-capture-${inputs.runId}-${inputs.runAttempt}`;
            const acceptedResultName =
              `livepatch-result-${process.env.EXPECTED_IMPORTED_ROW_ID}-` +
              `${inputs.runId}-${inputs.runAttempt}`;
            const resultSuffix = `-${inputs.runId}-${inputs.runAttempt}`;
            const selected = artifacts.filter((artifact) =>
              artifact.name === planName || artifact.name === captureName ||
              (artifact.name.startsWith('livepatch-result-') && artifact.name.endsWith(resultSuffix)));
            const exact = (name) => selected.filter((artifact) => artifact.name === name);
            const resultArtifacts = selected.filter((artifact) =>
              artifact.name.startsWith('livepatch-result-'));
            const safeResultName = new RegExp(
              `^livepatch-result-[A-Za-z0-9._-]+-${inputs.runId}-${inputs.runAttempt}$`,
            );
            if (exact(planName).length !== 1 || exact(captureName).length !== 1 ||
                resultArtifacts.length === 0 ||
                resultArtifacts.some((artifact) => !safeResultName.test(artifact.name)) ||
                new Set(selected.map((artifact) => artifact.name)).size !== selected.length ||
                selected.some((artifact) => artifact.expired ||
                  !/^sha256:[0-9a-f]{64}$/.test(artifact.digest || ''))) {
              core.setFailed('source artifacts are missing, duplicated, expired, or lack a SHA-256 digest');
              return;
            }
            if (exact(planName)[0].digest !==
                  `sha256:${process.env.EXPECTED_PLAN_ARCHIVE_SHA256}` ||
                exact(captureName)[0].digest !==
                  `sha256:${process.env.EXPECTED_CAPTURE_ARCHIVE_SHA256}` ||
                exact(acceptedResultName).length !== 1 ||
                exact(acceptedResultName)[0].digest !==
                  `sha256:${process.env.EXPECTED_IMPORTED_RESULT_ARCHIVE_SHA256}`) {
              core.setFailed('source artifact service digest does not match the authorized continuation');
              return;
            }

            const provenance = {
              schemaVersion: 1,
              source: {
                repository: process.env.EXPECTED_REPOSITORY,
                runId,
                runAttempt: attempt,
                headSha: inputs.sourceRevision,
                status: run.status,
                workflowId: run.workflow_id,
                workflowPath: expectedWorkflow.data.path,
              },
              controller: {
                headSha: process.env.CONTROLLER_REVISION,
                runId: Number(process.env.GITHUB_RUN_ID),
                runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              },
              requested: {
                planSha256: inputs.planSha256,
                captureSha256: inputs.captureSha256,
              },
              artifacts: selected
                .map((artifact) => ({
                  id: artifact.id,
                  name: artifact.name,
                  digest: artifact.digest,
                  sizeInBytes: artifact.size_in_bytes,
                  createdAt: artifact.created_at,
                  expired: artifact.expired,
                  expiresAt: artifact.expires_at,
                }))
                .sort((left, right) => left.name.localeCompare(right.name)),
            };
            core.setOutput('provenance', JSON.stringify(provenance));
            core.setOutput('enabled', 'true');

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs['resume-source-revision'] || github.sha }}
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: maintenance.auto
          GIT_CONFIG_VALUE_0: "false"

      - name: Prepare locked livepatch CI tools
        run: tools/livepatch/prepare-ci-tools.sh

      - name: Prepare livepatch discovery workspace
        id: workspace
        env:
          LIVEPATCH_CI_ROOT: ${{ runner.temp }}
          LIVEPATCH_CI_JOB: discover
          LIVEPATCH_CI_RUN_ID: ${{ github.run_id }}
          LIVEPATCH_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          workspace=$(tools/livepatch/ci-workspace.sh prepare \
            --root "$LIVEPATCH_CI_ROOT" \
            --job "$LIVEPATCH_CI_JOB" \
            --run-id "$LIVEPATCH_CI_RUN_ID" \
            --run-attempt "$LIVEPATCH_CI_RUN_ATTEMPT")
          printf 'directory=%s\n' "$workspace" >> "$GITHUB_OUTPUT"

      - name: Record qualification resume provenance
        if: ${{ steps.resume.outputs.enabled == 'true' }}
        env:
          LIVEPATCH_CI_WORKSPACE: ${{ steps.workspace.outputs.directory }}
          RESUME_PROVENANCE: ${{ steps.resume.outputs.provenance }}
        run: |
          set -euo pipefail
          provenance="$LIVEPATCH_CI_WORKSPACE/resume-provenance-api.json"
          [[ ! -e "$provenance" && ! -L "$provenance" ]]
          printf '%s\n' "$RESUME_PROVENANCE" > "$provenance"
          chmod 600 "$provenance"

      - name: Download the source qualification plan
        if: ${{ steps.resume.outputs.enabled == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: livepatch-plan-${{ inputs['resume-source-run-id'] }}-${{ inputs['resume-source-run-attempt'] }}
          path: ${{ steps.workspace.outputs.directory }}/resume/plan
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs['resume-source-run-id'] }}

      - name: Download the source qualification capture
        if: ${{ steps.resume.outputs.enabled == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: livepatch-capture-${{ inputs['resume-source-run-id'] }}-${{ inputs['resume-source-run-attempt'] }}
          path: ${{ steps.workspace.outputs.directory }}/resume/capture
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs['resume-source-run-id'] }}

      - name: Download source qualification results
        if: ${{ steps.resume.outputs.enabled == 'true' }}
        uses: actions/download-artifact@v8
        with:
          pattern: livepatch-result-*-${{ inputs['resume-source-run-id'] }}-${{ inputs['resume-source-run-attempt'] }}
          path: ${{ steps.workspace.outputs.directory }}/resume/results
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs['resume-source-run-id'] }}

      - name: Resolve the affected push range
        if: ${{ steps.resume.outputs.enabled != 'true' }}
        env:
          CONTROLLER_REVISION: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_REPOSITORY: vpsfreecz/vpsadminos
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_HEAD: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LIVEPATCH_CI_WORKSPACE: ${{ steps.workspace.outputs.directory }}
        run: |
          set -euo pipefail
          changed="$LIVEPATCH_CI_WORKSPACE/changed-paths.txt"
          source_revision=$(git rev-parse HEAD)
          base=$source_revision
          head=$source_revision
          : > "$changed"

          if [[ "$EVENT_NAME" == push ]]; then
            head=$EVENT_HEAD
            test -n "$head"
            if [[ "$EVENT_BEFORE" =~ ^0+$ ]]; then
              test -n "$DEFAULT_BRANCH"
              git fetch --no-tags --prune origin \
                "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
              base=$(git merge-base "refs/remotes/origin/$DEFAULT_BRANCH" "$head")
            else
              base=$EVENT_BEFORE
              if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
                git fetch --no-tags --depth=1 origin "$base"
              fi
            fi
            git cat-file -e "$base^{commit}"
            git cat-file -e "$head^{commit}"
            git diff --name-only "$base" "$head" > "$changed"
          elif [[ "$EVENT_NAME" != workflow_dispatch ]]; then
            echo "unsupported livepatch workflow event: $EVENT_NAME" >&2
            exit 1
          fi

          jq -n \
            --arg event "$EVENT_NAME" \
            --arg base "$base" \
            --arg head "$head" \
            --arg sourceRevision "$source_revision" \
            --arg changedPathsSha256 "$(sha256sum "$changed" | cut -d' ' -f1)" \
            '{
              event: $event,
              base: $base,
              head: $head,
              sourceRevision: $sourceRevision,
              changedPathsSha256: $changedPathsSha256
            }' \
            > "$LIVEPATCH_CI_WORKSPACE/range.json"

      - name: Discover one canonical plan and its affected view
        id: plan
        env:
          CONTROLLER_REVISION: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_CAPTURE_ARCHIVE_SHA256: 9527e0907ce8ecc45b0e574db3b5168671da34046c8d0c946b0e3dc65b579526
          EXPECTED_IMPORTED_ROW_ID: 6.12.113.4--set-vendor-aged-transition--amd
          EXPECTED_IMPORTED_RESULT_ARCHIVE_SHA256: 85aec18ea28f1ecbc74f2308c3704efab45e14db782b5b0bde2c3bfdd3a132e5
          EXPECTED_IMPORTED_RESULT_SHA256: d17dfa085572191184dc8c42a34394508763deac990c8597b882ad9b8dfc35b1
          EXPECTED_IMPORTED_ROWS: "1"
          EXPECTED_PLAN_ARCHIVE_SHA256: 0cf4af028d6469619f1ab68d6169720ba991332651540a88eb70d4d9dff43c83
          EXPECTED_PLANNED_ROWS: "84"
          EXPECTED_REPOSITORY: vpsfreecz/vpsadminos
          MANUAL_KERNELS: ${{ inputs['kernel-versions'] }}
          LIVEPATCH_CI_WORKSPACE: ${{ steps.workspace.outputs.directory }}
          RESUME_CAPTURE_SHA256: ${{ inputs['resume-capture-sha256'] }}
          RESUME_MODE: ${{ steps.resume.outputs.enabled }}
          RESUME_PLAN_SHA256: ${{ inputs['resume-plan-sha256'] }}
          RESUME_SOURCE_REVISION: ${{ inputs['resume-source-revision'] }}
          RESUME_SOURCE_RUN_ATTEMPT: ${{ inputs['resume-source-run-attempt'] }}
          RESUME_SOURCE_RUN_ID: ${{ inputs['resume-source-run-id'] }}
        run: |
          set -euo pipefail
          imported_rows=0
          if [[ "$RESUME_MODE" == true ]]; then
            resume="$LIVEPATCH_CI_WORKSPACE/resume"
            source_plan="$resume/plan/plan.json"
            source_capture="$resume/capture/capture.json"
            source_evidence="$resume/capture/evidence"
            source_results="$resume/results"
            imported="$LIVEPATCH_CI_WORKSPACE/imported-results"
            api_provenance="$LIVEPATCH_CI_WORKSPACE/resume-provenance-api.json"
            accepted_ids="$LIVEPATCH_CI_WORKSPACE/accepted-row-ids.json"
            result_roots="$LIVEPATCH_CI_WORKSPACE/result-artifact-roots.tsv"
            service_results="$LIVEPATCH_CI_WORKSPACE/service-results.txt"
            extracted_results="$LIVEPATCH_CI_WORKSPACE/extracted-results.txt"

            for root in "$resume/plan" "$resume/capture" "$source_results"; do
              [[ -d "$root" && ! -L "$root" ]]
              [[ -z $(find "$root" -type l -print -quit) ]]
            done
            for input in "$source_plan" "$source_capture" "$api_provenance"; do
              [[ -f "$input" && ! -L "$input" ]]
            done
            jq -e \
              --arg repository "$EXPECTED_REPOSITORY" \
              --argjson runId "$RESUME_SOURCE_RUN_ID" \
              --argjson runAttempt "$RESUME_SOURCE_RUN_ATTEMPT" \
              --arg sourceRevision "$RESUME_SOURCE_REVISION" \
              --arg controllerRevision "$CONTROLLER_REVISION" \
              --arg planSha256 "$RESUME_PLAN_SHA256" \
              --arg captureSha256 "$RESUME_CAPTURE_SHA256" \
              --arg planName "livepatch-plan-$RESUME_SOURCE_RUN_ID-$RESUME_SOURCE_RUN_ATTEMPT" \
              --arg planDigest "sha256:$EXPECTED_PLAN_ARCHIVE_SHA256" \
              --arg captureName "livepatch-capture-$RESUME_SOURCE_RUN_ID-$RESUME_SOURCE_RUN_ATTEMPT" \
              --arg captureDigest "sha256:$EXPECTED_CAPTURE_ARCHIVE_SHA256" \
              --arg acceptedName "livepatch-result-$EXPECTED_IMPORTED_ROW_ID-$RESUME_SOURCE_RUN_ID-$RESUME_SOURCE_RUN_ATTEMPT" \
              --arg acceptedDigest "sha256:$EXPECTED_IMPORTED_RESULT_ARCHIVE_SHA256" \
              --arg resultSuffix "-$RESUME_SOURCE_RUN_ID-$RESUME_SOURCE_RUN_ATTEMPT" '
              .schemaVersion == 1
              and .source.repository == $repository
              and .source.runId == $runId
              and .source.runAttempt == $runAttempt
              and .source.headSha == $sourceRevision
              and .source.status == "completed"
              and .source.workflowPath == ".github/workflows/livepatch-qualification.yml"
              and .controller.headSha == $controllerRevision
              and .requested.planSha256 == $planSha256
              and .requested.captureSha256 == $captureSha256
              and ([.artifacts[] | select(.name == $planName)] | length) == 1
              and ([.artifacts[] | select(
                .name == $planName and .digest == $planDigest
              )] | length) == 1
              and ([.artifacts[] | select(.name == $captureName)] | length) == 1
              and ([.artifacts[] | select(
                .name == $captureName and .digest == $captureDigest
              )] | length) == 1
              and ([.artifacts[] | select(
                .name == $acceptedName and .digest == $acceptedDigest
              )] | length) == 1
              and ([.artifacts[] | select(
                (.name | startswith("livepatch-result-"))
                and (.name | endswith($resultSuffix))
              )] | length) > 0
              and ([.artifacts[].name] | unique | length) == (.artifacts | length)
              and all(.artifacts[];
                .expired == false
                and (.digest | test("^sha256:[0-9a-f]{64}$"))
              )
            ' "$api_provenance" >/dev/null
            [[ -d "$source_evidence" && ! -L "$source_evidence" ]]
            [[ $(sha256sum "$source_plan" | cut -d' ' -f1) == "$RESUME_PLAN_SHA256" ]]
            [[ $(sha256sum "$source_capture" | cut -d' ' -f1) == "$RESUME_CAPTURE_SHA256" ]]
            [[ $(jq -er '.sourceRevision' "$source_plan") == "$RESUME_SOURCE_REVISION" ]]
            [[ $(jq -er '.sourceRevision' "$source_capture") == "$RESUME_SOURCE_REVISION" ]]
            [[ $(git rev-parse HEAD) == "$RESUME_SOURCE_REVISION" ]]
            jq -e --argjson plannedRows "$EXPECTED_PLANNED_ROWS" '
              .schemaVersion == 1
              and .counts.matrixRows == $plannedRows
              and (.matrix.include | length) == $plannedRows
              and (.rows | length) == $plannedRows
              and ([.matrix.include[].rowId] | unique | length) == $plannedRows
              and ([.rows[].rowId] | unique | length) == $plannedRows
              and ([.matrix.include[].rowId] | sort) == ([.rows[].rowId] | sort)
            ' "$source_plan" >/dev/null
            tools/livepatch/verify.sh \
              --plan "$source_plan" \
              --capture "$source_capture" \
              --evidence-dir "$source_evidence" \
              > "$LIVEPATCH_CI_WORKSPACE/resume-capture-verification.json"

            jq -er '
              .artifacts[]
              | select(.name | startswith("livepatch-result-"))
              | .name
            ' "$api_provenance" | LC_ALL=C sort > "$service_results"
            mapfile -t result_artifacts < "$service_results"
            ((${#result_artifacts[@]} > 0))
            : > "$result_roots"
            if ((${#result_artifacts[@]} == 1)); then
              printf '%s\t%s\n' "${result_artifacts[0]}" "$source_results" \
                > "$result_roots"
            else
              find "$source_results" -mindepth 1 -maxdepth 1 -printf '%f\t%y\n' \
                | LC_ALL=C sort > "$extracted_results"
              awk -F '\t' 'NF != 2 || $2 != "d" { exit 1 }' "$extracted_results"
              cut -f1 "$extracted_results" > "$extracted_results.names"
              cmp -- "$service_results" "$extracted_results.names"
              while IFS= read -r artifact_name; do
                artifact="$source_results/$artifact_name"
                [[ -d "$artifact" && ! -L "$artifact" ]]
                printf '%s\t%s\n' "$artifact_name" "$artifact" >> "$result_roots"
              done < "$service_results"
            fi
            [[ $(wc -l < "$result_roots") -eq ${#result_artifacts[@]} ]]

            mkdir "$imported"
            printf '[]\n' > "$accepted_ids"
            while IFS=$'\t' read -r artifact_name artifact; do
              [[ -n "$artifact_name" && -n "$artifact" ]]
              mapfile -t receipts < <(find "$artifact" -type f -name result.json -print)
              ((${#receipts[@]} == 1))
              receipt=${receipts[0]}
              row_id=$(jq -er '.rowId' "$receipt")
              [[ "$artifact_name" == \
                "livepatch-result-$row_id-$RESUME_SOURCE_RUN_ID-$RESUME_SOURCE_RUN_ATTEMPT" ]]
              jq -e --arg rowId "$row_id" '
                [.[] | select(. == $rowId)] | length == 0
              ' "$accepted_ids" >/dev/null
              tools/livepatch/verify.sh \
                --plan "$source_plan" \
                --capture "$source_capture" \
                --evidence-dir "$source_evidence" \
                --row-id "$row_id" \
                --result "$receipt" >/dev/null
              if jq -e '
                .accepted == true
                and .runnerStatus == 0
                and .validator.status == "accepted"
              ' "$receipt" >/dev/null; then
                mkdir "$imported/$artifact_name"
                cp -- "$receipt" "$imported/$artifact_name/result.json"
                jq --arg rowId "$row_id" '. + [$rowId]' "$accepted_ids" \
                  > "$accepted_ids.next"
                mv -- "$accepted_ids.next" "$accepted_ids"
              elif jq -e '.accepted == true' "$receipt" >/dev/null; then
                echo "accepted source receipt has a failed runner or validator: $row_id" >&2
                exit 1
              fi
            done < "$result_roots"

            jq -e --arg rowId "$EXPECTED_IMPORTED_ROW_ID" \
              --argjson importedRows "$EXPECTED_IMPORTED_ROWS" '
              length == $importedRows and . == [$rowId]
            ' "$accepted_ids" >/dev/null
            imported_receipt="$imported/livepatch-result-$EXPECTED_IMPORTED_ROW_ID-$RESUME_SOURCE_RUN_ID-$RESUME_SOURCE_RUN_ATTEMPT/result.json"
            [[ -f "$imported_receipt" && ! -L "$imported_receipt" ]]
            [[ $(sha256sum "$imported_receipt" | cut -d' ' -f1) == \
              "$EXPECTED_IMPORTED_RESULT_SHA256" ]]

            cp -- "$source_plan" "$LIVEPATCH_CI_WORKSPACE/plan.json"
            cp -- "$resume/plan/affected-plan.json" "$LIVEPATCH_CI_WORKSPACE/affected-plan.json"
            jq --slurpfile accepted "$accepted_ids" '
              .include |= map(select(.rowId as $rowId | ($accepted[0] | index($rowId) | not)))
            ' "$resume/plan/matrix.json" > "$LIVEPATCH_CI_WORKSPACE/matrix.json"
            pending_rows=$((EXPECTED_PLANNED_ROWS - EXPECTED_IMPORTED_ROWS))
            [[ $(jq -er '.include | length' "$LIVEPATCH_CI_WORKSPACE/matrix.json") == \
              "$pending_rows" ]]
            cp -- "$api_provenance" "$LIVEPATCH_CI_WORKSPACE/resume-provenance.json"
            jq --arg planSha256 "$RESUME_PLAN_SHA256" \
              --arg captureSha256 "$RESUME_CAPTURE_SHA256" \
              --arg acceptedRowId "$(jq -er '.[0]' "$accepted_ids")" \
              --arg acceptedResultSha256 "$(sha256sum "$imported_receipt" | cut -d' ' -f1)" \
              '. + {extracted: {
                planSha256: $planSha256,
                captureSha256: $captureSha256,
                acceptedResults: [{
                  rowId: $acceptedRowId,
                  sha256: $acceptedResultSha256
                }]
              }}' "$api_provenance" > "$LIVEPATCH_CI_WORKSPACE/resume-provenance.next"
            mv -- "$LIVEPATCH_CI_WORKSPACE/resume-provenance.next" \
              "$LIVEPATCH_CI_WORKSPACE/resume-provenance.json"
            cp -- "$LIVEPATCH_CI_WORKSPACE/resume-provenance.json" "$imported/provenance.json"
            imported_rows=$EXPECTED_IMPORTED_ROWS
          else
            tools/livepatch/discover.sh \
              --plan "$LIVEPATCH_CI_WORKSPACE/full-plan.json" \
              --matrix "$LIVEPATCH_CI_WORKSPACE/full-matrix.json"

            if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
              selector=()
              while IFS= read -r kernel || [[ -n "$kernel" ]]; do
                [[ -n "$kernel" ]] || continue
                selector+=(--kernel-version "$kernel")
              done <<< "$MANUAL_KERNELS"
              if ((${#selector[@]})); then
                tools/livepatch/discover.sh \
                  --input "$LIVEPATCH_CI_WORKSPACE/full-plan.json" \
                  --plan "$LIVEPATCH_CI_WORKSPACE/plan.json" \
                  --matrix "$LIVEPATCH_CI_WORKSPACE/matrix.json" \
                  "${selector[@]}"
                cp "$LIVEPATCH_CI_WORKSPACE/plan.json" \
                  "$LIVEPATCH_CI_WORKSPACE/affected-plan.json"
              else
                cp "$LIVEPATCH_CI_WORKSPACE/full-plan.json" "$LIVEPATCH_CI_WORKSPACE/plan.json"
                cp "$LIVEPATCH_CI_WORKSPACE/full-matrix.json" "$LIVEPATCH_CI_WORKSPACE/matrix.json"
                tools/livepatch/discover.sh \
                  --input "$LIVEPATCH_CI_WORKSPACE/full-plan.json" \
                  --plan "$LIVEPATCH_CI_WORKSPACE/affected-plan.json" \
                  --matrix "$LIVEPATCH_CI_WORKSPACE/affected-qualification-matrix.json" \
                  --changed-paths "$LIVEPATCH_CI_WORKSPACE/changed-paths.txt"
              fi
            else
              cp "$LIVEPATCH_CI_WORKSPACE/full-plan.json" "$LIVEPATCH_CI_WORKSPACE/plan.json"
              cp "$LIVEPATCH_CI_WORKSPACE/full-matrix.json" "$LIVEPATCH_CI_WORKSPACE/matrix.json"
              tools/livepatch/discover.sh \
                --input "$LIVEPATCH_CI_WORKSPACE/full-plan.json" \
                --plan "$LIVEPATCH_CI_WORKSPACE/affected-plan.json" \
                --matrix "$LIVEPATCH_CI_WORKSPACE/affected-qualification-matrix.json" \
                --changed-paths "$LIVEPATCH_CI_WORKSPACE/changed-paths.txt"
            fi
          fi

          jq -c '{include: [.sets[] | {
            setId: .id,
            kernelVersion,
            tipRelease,
            memberCount: (.members | length)
          }]}' "$LIVEPATCH_CI_WORKSPACE/affected-plan.json" \
            > "$LIVEPATCH_CI_WORKSPACE/affected-matrix.json"
          matrix=$(cat "$LIVEPATCH_CI_WORKSPACE/matrix.json")
          affected_matrix=$(cat "$LIVEPATCH_CI_WORKSPACE/affected-matrix.json")
          test "${#matrix}" -lt 65536
          test "${#affected_matrix}" -lt 65536
          {
            printf 'matrix=%s\n' "$matrix"
            printf 'selected-sets=%s\n' "$(jq -er '.selectedSets' "$LIVEPATCH_CI_WORKSPACE/plan.json")"
            printf 'source-revision=%s\n' "$(jq -er '.sourceRevision' "$LIVEPATCH_CI_WORKSPACE/plan.json")"
            printf 'affected-matrix=%s\n' "$affected_matrix"
            printf 'affected-selected-sets=%s\n' \
              "$(jq -er '.selectedSets' "$LIVEPATCH_CI_WORKSPACE/affected-plan.json")"
            printf 'imported-rows=%s\n' "$imported_rows"
          } >> "$GITHUB_OUTPUT"

      - name: Re-export the imported qualification capture
        if: ${{ steps.resume.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: livepatch-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.directory }}/resume/capture
          if-no-files-found: error
          retention-days: 30

      - name: Re-export validated imported results
        if: ${{ steps.resume.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: livepatch-imported-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.directory }}/imported-results
          if-no-files-found: error
          retention-days: 30

      - name: Upload the detailed qualification plan
        uses: actions/upload-artifact@v7
        with:
          name: livepatch-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.workspace.outputs.directory }}
            !${{ steps.workspace.outputs.directory }}/resume/**
            !${{ steps.workspace.outputs.directory }}/imported-results/**
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup livepatch discovery workspace
        if: ${{ always() && steps.workspace.outcome == 'success' }}
        env:
          LIVEPATCH_CI_ROOT: ${{ runner.temp }}
          LIVEPATCH_CI_JOB: discover
          LIVEPATCH_CI_RUN_ID: ${{ github.run_id }}
          LIVEPATCH_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          LIVEPATCH_CI_WORKSPACE: ${{ steps.workspace.outputs.directory }}
        run: |
          tools/livepatch/ci-workspace.sh cleanup \
            --root "$LIVEPATCH_CI_ROOT" \
            --job "$LIVEPATCH_CI_JOB" \
            --run-id "$LIVEPATCH_CI_RUN_ID" \
            --run-attempt "$LIVEPATCH_CI_RUN_ATTEMPT" \
            --directory "$LIVEPATCH_CI_WORKSPACE"

  capture:
    name: Build and capture the selected livepatch set
    if: ${{ needs.discover.outputs.selected-sets != '0' }}
    needs: discover
    runs-on: self-hosted
    outputs:
      capture-sha256: ${{ steps.capture.outputs.sha256 }}
      workload-matrix: ${{ steps.coverage.outputs.workload-matrix }}
      workload-selected-sets: ${{ steps.coverage.outputs.workload-selected-sets }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.discover.outputs.source-revision }}
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: maintenance.auto
          GIT_CONFIG_VALUE_0: "false"

      - name: Prepare locked livepatch CI tools
        run: tools/livepatch/prepare-ci-tools.sh

      - name: Prepare livepatch capture workspace
        id: workspace
        env:
          LIVEPATCH_CI_ROOT: ${{ runner.temp }}
          LIVEPATCH_CI_JOB: capture
          LIVEPATCH_CI_RUN_ID: ${{ github.run_id }}
          LIVEPATCH_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          workspace=$(tools/livepatch/ci-workspace.sh prepare \
            --root "$LIVEPATCH_CI_ROOT" \
            --job "$LIVEPATCH_CI_JOB" \
            --run-id "$LIVEPATCH_CI_RUN_ID" \
            --run-attempt "$LIVEPATCH_CI_RUN_ATTEMPT")
          printf 'directory=%s\n' "$workspace" >> "$GITHUB_OUTPUT"

      - name: Download the current-run qualification plan
        uses: actions/download-artifact@v8
        with:
          name: livepatch-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.directory }}/input

      - name: Download the current-run resume capture
        if: ${{ needs.discover.outputs.resume-mode == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: livepatch-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.directory }}/input/capture

      - name: Capture one dynamic producer identity set
        id: capture
        env:
          LIVEPATCH_CI_WORKSPACE: ${{ steps.workspace.outputs.directory }}
          RESUME_CAPTURE_SHA256: ${{ inputs['resume-capture-sha256'] }}
          RESUME_MODE: ${{ needs.discover.outputs.resume-mode }}
        run: |
          set -euo pipefail
          plan="$LIVEPATCH_CI_WORKSPACE/input/plan.json"
          test "$(git rev-parse HEAD)" = "$(jq -er '.sourceRevision' "$plan")"
          if [[ "$RESUME_MODE" == true ]]; then
            capture="$LIVEPATCH_CI_WORKSPACE/input/capture/capture.json"
            evidence="$LIVEPATCH_CI_WORKSPACE/input/capture/evidence"
            [[ $(sha256sum "$capture" | cut -d' ' -f1) == "$RESUME_CAPTURE_SHA256" ]]
            tools/livepatch/verify.sh \
              --plan "$plan" \
              --capture "$capture" \
              --evidence-dir "$evidence" \
              > "$LIVEPATCH_CI_WORKSPACE/resume-capture-verification.json"
          else
            mkdir "$LIVEPATCH_CI_WORKSPACE/capture"
            capture="$LIVEPATCH_CI_WORKSPACE/capture/capture.json"
            tools/livepatch/capture.sh \
              --plan "$plan" \
              --output "$capture" \
              --evidence-dir "$LIVEPATCH_CI_WORKSPACE/capture/evidence"
            tools/livepatch/verify.sh \
              --plan "$plan" \
              --capture "$capture" \
              --evidence-dir "$LIVEPATCH_CI_WORKSPACE/capture/evidence" \
              > "$LIVEPATCH_CI_WORKSPACE/capture/verification.json"
          fi
          printf 'sha256=%s\n' \
            "$(sha256sum "$capture" | cut -d' ' -f1)" \
            >> "$GITHUB_OUTPUT"

      - name: Publish and prove captured producer closures
        if: ${{ needs.discover.outputs.resume-mode != 'true' }}
        env:
          LIVEPATCH_CI_WORKSPACE: ${{ steps.workspace.outputs.directory }}
          VPSADMINOS_CACHE_SSH_KEY: ${{ secrets.VPSADMINOS_CACHE_SSH_KEY }}
          VPSADMINOS_PUBLIC_CACHE: https://cache.vpsadminos.org
          VPSADMINOS_PUBLIC_CACHE_KEY: cache.vpsadminos.org:wpIJlNZQIhS+0gFf1U3MC9sLZdLW3sh5qakOWGDoDrE=
        run: |
          set -euo pipefail
          capture="$LIVEPATCH_CI_WORKSPACE/capture/capture.json"
          local_requisites="$LIVEPATCH_CI_WORKSPACE/capture/local-requisites.txt"
          recorded_requisites="$LIVEPATCH_CI_WORKSPACE/capture/recorded-requisites.txt"
          public_requisites="$LIVEPATCH_CI_WORKSPACE/capture/public-requisites.txt"
          local_info="$LIVEPATCH_CI_WORKSPACE/capture/local-path-info.json"
          public_info="$LIVEPATCH_CI_WORKSPACE/capture/public-path-info.json"
          producer_nars="$LIVEPATCH_CI_WORKSPACE/capture/producer-nar-sha256.tsv"
          expected_members=$(jq -er '.counts.capturedMembers' "$capture")
          [[ "$expected_members" =~ ^[1-9][0-9]*$ ]]
          mapfile -t producers < <(
            jq -er '.sets[].members[].identity.producer' "$capture"
          )
          ((${#producers[@]} == expected_members))
          unique_producers=$(printf '%s\n' "${producers[@]}" \
            | LC_ALL=C sort -u | wc -l)
          ((unique_producers == expected_members))

          jq -er '.sets[].members[].audit.requisites[]' "$capture" \
            | LC_ALL=C sort -u > "$recorded_requisites"
          nix-store --query --requisites "${producers[@]}" \
            | LC_ALL=C sort -u > "$local_requisites"
          cmp -- "$recorded_requisites" "$local_requisites"

          install -m 600 -D <(printf '%s\n' "$VPSADMINOS_CACHE_SSH_KEY") .ssh/cache_id
          export NIX_SSHOPTS='-i .ssh/cache_id -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          nix-copy-closure --to push@cache.int.vpsadminos.org "${producers[@]}"

          branch="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}-livepatch"
          [[ -n "$branch" && "$branch" != -livepatch ]]
          for producer in "${producers[@]}"; do
            ssh -i .ssh/cache_id \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              push@cache.int.vpsadminos.org \
              sudo push-ci-generation "$branch" "$producer"
          done

          nix path-info --json --json-format 1 --recursive "${producers[@]}" \
            > "$local_info"
          nix path-info --store "$VPSADMINOS_PUBLIC_CACHE" \
            --json --json-format 1 --recursive "${producers[@]}" \
            > "$public_info"
          jq -r 'keys[]' "$public_info" | LC_ALL=C sort -u > "$public_requisites"
          cmp -- "$recorded_requisites" "$public_requisites"
          nix store verify \
            --store "$VPSADMINOS_PUBLIC_CACHE" \
            --recursive \
            --no-contents \
            --sigs-needed 1 \
            --option trusted-public-keys "$VPSADMINOS_PUBLIC_CACHE_KEY" \
            "${producers[@]}"

          : > "$producer_nars"
          for producer in "${producers[@]}"; do
            jq -S --arg producer "$producer" '
              .[$producer]
              | {
                  narHash,
                  narSize,
                  references: (.references | sort),
                  deriver
                }
            ' "$local_info" > "$LIVEPATCH_CI_WORKSPACE/local-producer.json"
            jq -S --arg producer "$producer" '
              .[$producer]
              | {
                  narHash,
                  narSize,
                  references: (.references | sort),
                  deriver
                }
            ' "$public_info" > "$LIVEPATCH_CI_WORKSPACE/public-producer.json"
            cmp -- "$LIVEPATCH_CI_WORKSPACE/local-producer.json" \
              "$LIVEPATCH_CI_WORKSPACE/public-producer.json"
            local_nar=$(nix store dump-path "$producer" | sha256sum | cut -d' ' -f1)
            public_nar=$(nix store dump-path \
              --store "$VPSADMINOS_PUBLIC_CACHE" "$producer" \
              | sha256sum | cut -d' ' -f1)
            [[ "$local_nar" == "$public_nar" ]]
            printf '%s\t%s\n' "$producer" "$local_nar" >> "$producer_nars"
          done
          rm -- "$LIVEPATCH_CI_WORKSPACE/local-producer.json" \
            "$LIVEPATCH_CI_WORKSPACE/public-producer.json"

      - name: Decide ordinary workload coverage from exact tuples
        id: coverage
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF_NAME: ${{ github.head_ref }}
          LIVEPATCH_CI_WORKSPACE: ${{ steps.workspace.outputs.directory }}
          RESUME_MODE: ${{ needs.discover.outputs.resume-mode }}
        run: |
          set -euo pipefail
          plan="$LIVEPATCH_CI_WORKSPACE/input/plan.json"
          affected="$LIVEPATCH_CI_WORKSPACE/input/affected-plan.json"
          if [[ "$RESUME_MODE" == true ]]; then
            capture_dir="$LIVEPATCH_CI_WORKSPACE/input/capture"
          else
            capture_dir="$LIVEPATCH_CI_WORKSPACE/capture"
          fi
          capture="$capture_dir/capture.json"
          reference="$capture_dir/ordinary-reference.json"
          coverage="$capture_dir/ordinary-coverage.json"
          configuration=null
          source_revision=$(git rev-parse HEAD)
          if [[ "$GITHUB_REF" == refs/heads/snajpa-6.18 || "$GITHUB_HEAD_REF_NAME" == snajpa-6.18 ]]; then
            configuration='import ./os/configs/unstable.nix'
          fi
          EVENT_NAME="$EVENT_NAME" \
          SOURCE_REVISION="$source_revision" \
          LIVEPATCH_PLAN="$plan" \
          LIVEPATCH_AFFECTED_PLAN="$affected" \
          LIVEPATCH_CAPTURE="$capture" \
          nix eval --json --impure --expr "
            let flake = builtins.getFlake (toString ./.); in
            import ./tools/livepatch/ordinary-coverage.nix {
              inherit flake;
              root = ./.;
              system = \"x86_64-linux\";
              configuration = $configuration;
              sourceRevision = builtins.getEnv \"SOURCE_REVISION\";
              event = builtins.getEnv \"EVENT_NAME\";
              plan = builtins.fromJSON (builtins.readFile (builtins.getEnv \"LIVEPATCH_PLAN\"));
              affectedPlan = builtins.fromJSON (builtins.readFile (builtins.getEnv \"LIVEPATCH_AFFECTED_PLAN\"));
              capture = builtins.fromJSON (builtins.readFile (builtins.getEnv \"LIVEPATCH_CAPTURE\"));
            }
          " > "$coverage"
          jq '.normal' "$coverage" > "$reference"
          jq -c '.workloadMatrix' "$coverage" \
            > "$capture_dir/workload-matrix.next.json"
          if [[ "$RESUME_MODE" == true ]]; then
            cmp -- "$capture_dir/workload-matrix.json" "$capture_dir/workload-matrix.next.json"
            rm -- "$capture_dir/workload-matrix.next.json"
          else
            mv -- "$capture_dir/workload-matrix.next.json" "$capture_dir/workload-matrix.json"
          fi
          workload_matrix=$(cat "$capture_dir/workload-matrix.json")
          workload_count=$(jq -er '.include | length' "$capture_dir/workload-matrix.json")
          if [[ "$RESUME_MODE" == true ]]; then
            [[ "$workload_count" == 1 ]]
          fi
          test "${#workload_matrix}" -lt 65536
          {
            printf 'workload-matrix=%s\n' "$workload_matrix"
            printf 'workload-selected-sets=%s\n' "$workload_count"
          } >> "$GITHUB_OUTPUT"

      - name: Upload captured modules and realization evidence
        if: ${{ needs.discover.outputs.resume-mode != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: livepatch-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.directory }}/capture
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup livepatch capture workspace
        if: ${{ always() && steps.workspace.outcome == 'success' }}
        env:
          LIVEPATCH_CI_ROOT: ${{ runner.temp }}
          LIVEPATCH_CI_JOB: capture
          LIVEPATCH_CI_RUN_ID: ${{ github.run_id }}
          LIVEPATCH_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          LIVEPATCH_CI_WORKSPACE: ${{ steps.workspace.outputs.directory }}
        run: |
          tools/livepatch/ci-workspace.sh cleanup \
            --root "$LIVEPATCH_CI_ROOT" \
            --job "$LIVEPATCH_CI_JOB" \
            --run-id "$LIVEPATCH_CI_RUN_ID" \
            --run-attempt "$LIVEPATCH_CI_RUN_ATTEMPT" \
            --directory "$LIVEPATCH_CI_WORKSPACE"

  qualify:
    name: Livepatch ${{ matrix.rowId }}
    if: ${{ needs.discover.outputs.selected-sets != '0' }}
    continue-on-error: false
    needs:
      - discover
      - capture
    runs-on:
      group: vpsAdminOS runners
      labels: ${{ matrix.runnerClass }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.discover.outputs.source-revision }}
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: maintenance.auto
          GIT_CONFIG_VALUE_0: "false"

      - name: Prepare locked livepatch CI tools
        run: tools/livepatch/prepare-ci-tools.sh

      - name: Prepare livepatch qualification workspace
        id: workspace
        env:
          LIVEPATCH_CI_ROOT: ${{ runner.temp }}
          LIVEPATCH_CI_JOB: qualify
          LIVEPATCH_CI_RUN_ID: ${{ github.run_id }}
          LIVEPATCH_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          workspace=$(tools/livepatch/ci-workspace.sh prepare \
            --root "$LIVEPATCH_CI_ROOT" \
            --job "$LIVEPATCH_CI_JOB" \
            --run-id "$LIVEPATCH_CI_RUN_ID" \
            --run-attempt "$LIVEPATCH_CI_RUN_ATTEMPT")
          printf 'directory=%s\n' "$workspace" >> "$GITHUB_OUTPUT"

      - name: Prepare livepatch profile state
        id: prepare-profile
        uses: ./.github/actions/prepare-test-state

      - uses: actions/download-artifact@v8
        with:
          name: livepatch-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.directory }}/input

      - uses: actions/download-artifact@v8
        with:
          name: livepatch-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.directory }}/input/capture

      - name: Verify and run the selected stable row
        id: run
        env:
          LIVEPATCH_CI_WORKSPACE: ${{ steps.workspace.outputs.directory }}
          LIVEPATCH_PROFILE_STATE: ${{ steps.prepare-profile.outputs.state-directory }}/profile
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(jq -er '.sourceRevision' "$LIVEPATCH_CI_WORKSPACE/input/plan.json")"
          profile_state_bytes=$(LC_ALL=C printf '%s' "$LIVEPATCH_PROFILE_STATE" | wc -c)
          if ((profile_state_bytes > 63)); then
            echo "livepatch profile state path exceeds 63-byte socket budget: $profile_state_bytes" >&2
            exit 1
          fi
          tools/livepatch/run-profile.sh \
            --plan "$LIVEPATCH_CI_WORKSPACE/input/plan.json" \
            --capture "$LIVEPATCH_CI_WORKSPACE/input/capture/capture.json" \
            --evidence-dir "$LIVEPATCH_CI_WORKSPACE/input/capture/evidence" \
            --row-id '${{ matrix.rowId }}' \
            --state-dir "$LIVEPATCH_PROFILE_STATE"

      - name: Upload the uniform result and retained VM evidence
        id: upload-result
        if: ${{ always() && steps.run.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: livepatch-result-${{ matrix.rowId }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare-profile.outputs.state-directory }}/profile
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup livepatch profile state
        id: cleanup-profile
        if: ${{ always() }}
        uses: ./.github/actions/cleanup-test-state
        with:
          state-directory: ${{ steps.prepare-profile.outputs.state-directory }}
          prepare-outcome: ${{ steps.prepare-profile.outcome }}
          test-outcome: ${{ steps.run.outcome }}
          upload-outcome: ${{ steps.upload-result.outcome }}

      - name: Cleanup livepatch qualification workspace
        if: >-
          always() &&
          steps.workspace.outcome == 'success' &&
          steps.cleanup-profile.outcome == 'success' &&
          (steps.run.outcome == 'success' ||
          steps.run.outcome == 'skipped' ||
          steps.upload-result.outcome == 'success')
        env:
          LIVEPATCH_CI_ROOT: ${{ runner.temp }}
          LIVEPATCH_CI_JOB: qualify
          LIVEPATCH_CI_RUN_ID: ${{ github.run_id }}
          LIVEPATCH_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          LIVEPATCH_CI_WORKSPACE: ${{ steps.workspace.outputs.directory }}
        run: |
          tools/livepatch/ci-workspace.sh cleanup \
            --root "$LIVEPATCH_CI_ROOT" \
            --job "$LIVEPATCH_CI_JOB" \
            --run-id "$LIVEPATCH_CI_RUN_ID" \
            --run-attempt "$LIVEPATCH_CI_RUN_ATTEMPT" \
            --directory "$LIVEPATCH_CI_WORKSPACE"

  affected-regression:
    name: Ordinary CI on ${{ matrix.tipRelease }}
    if: ${{ needs.capture.outputs.workload-selected-sets != '0' }}
    needs:
      - discover
      - capture
    runs-on: self-hosted
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.capture.outputs.workload-matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.discover.outputs.source-revision }}
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: maintenance.auto
          GIT_CONFIG_VALUE_0: "false"

      - name: Prepare locked livepatch CI tools
        run: tools/livepatch/prepare-ci-tools.sh

      - name: Prepare affected-target test workspace
        id: workspace
        env:
          LIVEPATCH_CI_ROOT: ${{ runner.temp }}
          LIVEPATCH_CI_JOB: results
          LIVEPATCH_CI_RUN_ID: ${{ github.run_id }}
          LIVEPATCH_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          workspace=$(tools/livepatch/ci-workspace.sh prepare \
            --root "$LIVEPATCH_CI_ROOT" \
            --job "$LIVEPATCH_CI_JOB" \
            --run-id "$LIVEPATCH_CI_RUN_ID" \
            --run-attempt "$LIVEPATCH_CI_RUN_ATTEMPT")
          printf 'directory=%s\n' "$workspace" >> "$GITHUB_OUTPUT"

      - name: Prepare affected-target test state
        id: prepare-tests
        uses: ./.github/actions/prepare-test-state

      - uses: actions/download-artifact@v8
        with:
          name: livepatch-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.directory }}/input

      - uses: actions/download-artifact@v8
        with:
          name: livepatch-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.directory }}/input/capture

      - name: Verify capture and count-close ordinary CI
        env:
          LIVEPATCH_CI_WORKSPACE: ${{ steps.workspace.outputs.directory }}
          VPSADMINOS_CONFIG: ${{ github.workspace }}/tests/configs/vpsadminos/livepatch-regression.nix
          VPSADMINOS_LIVEPATCH_PLAN: ${{ steps.workspace.outputs.directory }}/input/plan.json
          VPSADMINOS_LIVEPATCH_CAPTURE: ${{ steps.workspace.outputs.directory }}/input/capture/capture.json
          VPSADMINOS_LIVEPATCH_SET_ID: ${{ matrix.setId }}
        run: |
          set -euo pipefail
          plan="$VPSADMINOS_LIVEPATCH_PLAN"
          capture="$VPSADMINOS_LIVEPATCH_CAPTURE"
          evidence="$LIVEPATCH_CI_WORKSPACE/input/capture/evidence"
          test "$(git rev-parse HEAD)" = "$(jq -er '.sourceRevision' "$plan")"
          tools/livepatch/verify.sh \
            --plan "$plan" \
            --capture "$capture" \
            --evidence-dir "$evidence" \
            > "$LIVEPATCH_CI_WORKSPACE/capture-verification.json"

          nix-instantiate --eval --strict --json \
            test-runner/nix/evaluate-tests.nix \
            --arg repoRoot "$GITHUB_WORKSPACE" \
            --argstr system x86_64-linux \
            --argstr mode testsMetaAll \
            --arg testConfigPath "$GITHUB_WORKSPACE/tests/test-configs/livepatch-regression.nix" \
            > "$LIVEPATCH_CI_WORKSPACE/tests-meta.json"
          jq -r '
            [
              to_entries[] as $test
              | ($test.value.testScripts | to_entries[]) as $script
              | (($test.value.tags // []) + ($script.value.tags // [])) as $tags
              | (($test.value.labels // {}) + ($script.value.labels // {})) as $labels
              | select($tags | index("ci"))
              | {
                  path: (
                    if (($test.value.testScripts | length) == 1 and ($test.value.testScripts | has("default")))
                    then $test.key
                    else "\($test.key)#\($script.key)"
                    end
                  ),
                  status: $labels["livepatch-regression"],
                  reason: $labels["livepatch-regression-reason"]
                }
            ] | sort_by(.path)
          ' "$LIVEPATCH_CI_WORKSPACE/tests-meta.json" \
            > "$LIVEPATCH_CI_WORKSPACE/ordinary-ci-inventory.json"
          jq -e '
            length > 0
            and (all(.status == "eligible" or .status == "excluded"))
            and (all(.reason != null and (.reason | length) > 0))
            and ([.[].path] | length == (unique | length))
            and ([.[] | select(.status == "eligible")] | length > 0)
            and ([.[] | select(.status == "excluded" and (
              .reason != "no-vpsadminos"
              and .reason != "firmware-boot"
              and .reason != "configuration-bypassed"
              and .reason != "fixture:production-manager"
              and .reason != "fixture:native-lifecycle"
              and .reason != "fixture:activation-policy"
            ))] | length == 0)
          ' "$LIVEPATCH_CI_WORKSPACE/ordinary-ci-inventory.json" >/dev/null
          jq -r '.[] | [.path, .status, .reason] | @tsv' \
            "$LIVEPATCH_CI_WORKSPACE/ordinary-ci-inventory.json" \
            > "$LIVEPATCH_CI_WORKSPACE/ordinary-ci-inventory.tsv"
          jq '{
            total: length,
            eligible: ([.[] | select(.status == "eligible")] | length),
            excluded: ([.[] | select(.status == "excluded")] | length),
            excludedReasons: ([.[] | select(.status == "excluded") | .reason]
              | group_by(.) | map({reason: .[0], count: length}))
          }' "$LIVEPATCH_CI_WORKSPACE/ordinary-ci-inventory.json" \
            > "$LIVEPATCH_CI_WORKSPACE/ordinary-ci-counts.json"

      - name: Run ordinary CI with the captured stack active
        id: run-tests
        timeout-minutes: 350
        env:
          TEST_RUNNER_STATE_DIR: ${{ steps.prepare-tests.outputs.state-directory }}
          VPSADMINOS_CONFIG: ${{ github.workspace }}/tests/configs/vpsadminos/livepatch-regression.nix
          VPSADMINOS_LIVEPATCH_PLAN: ${{ steps.workspace.outputs.directory }}/input/plan.json
          VPSADMINOS_LIVEPATCH_CAPTURE: ${{ steps.workspace.outputs.directory }}/input/capture/capture.json
          VPSADMINOS_LIVEPATCH_SET_ID: ${{ matrix.setId }}
        run: |
          set -o pipefail
          args=(
            test
            --test-config tests/test-configs/livepatch-regression.nix
            --state-dir "$TEST_RUNNER_STATE_DIR"
            --jobs auto
            --prebuild
            -f
            -t ci
            -l livepatch-regression=eligible
          )
          ./test-runner.sh "${args[@]}" | tee "$TEST_RUNNER_STATE_DIR/test.log"

      - name: Upload affected-target test evidence
        id: upload-test-logs
        if: ${{ always() && steps.prepare-tests.outcome == 'success' && steps.run-tests.outcome != 'skipped' }}
        uses: ./.github/actions/upload-test-logs
        with:
          name: os-test-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.setId }}
          retention-days: 30
          paths: |
            ${{ steps.prepare-tests.outputs.state-directory }}/**/*.log
            ${{ steps.prepare-tests.outputs.state-directory }}/**/*.txt
            ${{ steps.workspace.outputs.directory }}/input/plan.json
            ${{ steps.workspace.outputs.directory }}/input/capture/capture.json
            ${{ steps.workspace.outputs.directory }}/input/capture/ordinary-coverage.json
            ${{ steps.workspace.outputs.directory }}/ordinary-ci-inventory.json
            ${{ steps.workspace.outputs.directory }}/ordinary-ci-inventory.tsv
            ${{ steps.workspace.outputs.directory }}/ordinary-ci-counts.json

      - name: Evaluate affected-target test results
        if: ${{ always() && steps.prepare-tests.outcome == 'success' && steps.run-tests.outcome != 'skipped' }}
        uses: ./.github/actions/evaluate-test-results
        with:
          log-file: ${{ steps.prepare-tests.outputs.state-directory }}/test.log

      - name: Summarise affected-target test logs
        if: ${{ always() && steps.prepare-tests.outcome == 'success' && steps.run-tests.outcome != 'skipped' }}
        uses: ./.github/actions/summarise-test-logs
        with:
          logs-root: ${{ steps.prepare-tests.outputs.state-directory }}

      - name: Cleanup affected-target test state
        if: ${{ always() }}
        uses: ./.github/actions/cleanup-test-state
        with:
          state-directory: ${{ steps.prepare-tests.outputs.state-directory }}
          prepare-outcome: ${{ steps.prepare-tests.outcome }}
          test-outcome: ${{ steps.run-tests.outcome }}
          upload-outcome: ${{ steps.upload-test-logs.outcome }}

      - name: Cleanup affected-target test workspace
        if: >-
          always() &&
          steps.workspace.outcome == 'success' &&
          (steps.run-tests.outcome == 'success' || steps.upload-test-logs.outcome == 'success')
        env:
          LIVEPATCH_CI_ROOT: ${{ runner.temp }}
          LIVEPATCH_CI_JOB: results
          LIVEPATCH_CI_RUN_ID: ${{ github.run_id }}
          LIVEPATCH_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          LIVEPATCH_CI_WORKSPACE: ${{ steps.workspace.outputs.directory }}
        run: |
          tools/livepatch/ci-workspace.sh cleanup \
            --root "$LIVEPATCH_CI_ROOT" \
            --job "$LIVEPATCH_CI_JOB" \
            --run-id "$LIVEPATCH_CI_RUN_ID" \
            --run-attempt "$LIVEPATCH_CI_RUN_ATTEMPT" \
            --directory "$LIVEPATCH_CI_WORKSPACE"

  results:
    name: Close livepatch result counts
    if: ${{ always() && needs.discover.outputs.selected-sets != '0' }}
    needs:
      - affected-regression
      - discover
      - capture
      - qualify
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.discover.outputs.source-revision }}

      - name: Prepare locked livepatch CI tools
        run: tools/livepatch/prepare-ci-tools.sh

      - name: Prepare livepatch results workspace
        id: workspace
        env:
          LIVEPATCH_CI_ROOT: ${{ runner.temp }}
          LIVEPATCH_CI_JOB: results
          LIVEPATCH_CI_RUN_ID: ${{ github.run_id }}
          LIVEPATCH_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          workspace=$(tools/livepatch/ci-workspace.sh prepare \
            --root "$LIVEPATCH_CI_ROOT" \
            --job "$LIVEPATCH_CI_JOB" \
            --run-id "$LIVEPATCH_CI_RUN_ID" \
            --run-attempt "$LIVEPATCH_CI_RUN_ATTEMPT")
          printf 'directory=%s\n' "$workspace" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: livepatch-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.directory }}/input

      - uses: actions/download-artifact@v8
        with:
          pattern: livepatch-result-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.directory }}/results/new

      - name: Download validated imported results
        if: ${{ needs.discover.outputs.resume-mode == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: livepatch-imported-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.directory }}/results/imported

      - name: Require every scheduled qualification phase to succeed
        env:
          AFFECTED_RESULT: ${{ needs.affected-regression.result }}
          CAPTURE_RESULT: ${{ needs.capture.result }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
          QUALIFY_RESULT: ${{ needs.qualify.result }}
          RESUME_MODE: ${{ needs.discover.outputs.resume-mode }}
          WORKLOAD_SELECTED_SETS: ${{ needs.capture.outputs.workload-selected-sets }}
        run: |
          set -euo pipefail
          [[ "$DISCOVER_RESULT" == success && "$CAPTURE_RESULT" == success ]]
          [[ "$QUALIFY_RESULT" == success ]]
          if [[ "$WORKLOAD_SELECTED_SETS" == 0 ]]; then
            [[ "$AFFECTED_RESULT" == skipped ]]
          else
            [[ "$AFFECTED_RESULT" == success ]]
          fi
          if [[ "$RESUME_MODE" == true ]]; then
            [[ "$WORKLOAD_SELECTED_SETS" == 1 ]]
          fi

      - name: Require one accepted receipt for every planned row
        env:
          LIVEPATCH_CI_WORKSPACE: ${{ steps.workspace.outputs.directory }}
        run: |
          set -euo pipefail
          plan="$LIVEPATCH_CI_WORKSPACE/input/plan.json"
          tools/livepatch/verify.sh \
            --plan "$plan" \
            --results-dir "$LIVEPATCH_CI_WORKSPACE/results" \
            --output "$LIVEPATCH_CI_WORKSPACE/results/consolidated.json"
          if [[ '${{ needs.discover.outputs.resume-mode }}' == true ]]; then
            jq -e --arg rowId '6.12.113.4--set-vendor-aged-transition--amd' '
              .plannedRows == 84
              and (.receipts | length) == 84
              and ([.receipts[].rowId] | unique | length) == 84
              and ([.receipts[] | select(.rowId == $rowId)] | length) == 1
            ' "$LIVEPATCH_CI_WORKSPACE/results/consolidated.json" >/dev/null
            imported="$LIVEPATCH_CI_WORKSPACE/results/imported"
            [[ -f "$imported/provenance.json" && ! -L "$imported/provenance.json" ]]
          fi

      - name: Upload the count-closed result set
        uses: actions/upload-artifact@v7
        with:
          name: livepatch-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.directory }}/results
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup livepatch results workspace
        if: ${{ always() && steps.workspace.outcome == 'success' }}
        env:
          LIVEPATCH_CI_ROOT: ${{ runner.temp }}
          LIVEPATCH_CI_JOB: results
          LIVEPATCH_CI_RUN_ID: ${{ github.run_id }}
          LIVEPATCH_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          LIVEPATCH_CI_WORKSPACE: ${{ steps.workspace.outputs.directory }}
        run: |
          tools/livepatch/ci-workspace.sh cleanup \
            --root "$LIVEPATCH_CI_ROOT" \
            --job "$LIVEPATCH_CI_JOB" \
            --run-id "$LIVEPATCH_CI_RUN_ID" \
            --run-attempt "$LIVEPATCH_CI_RUN_ATTEMPT" \
            --directory "$LIVEPATCH_CI_WORKSPACE"
