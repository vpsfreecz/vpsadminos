name: Update flake inputs

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  CONFCTL_FLAKE: github:vpsfreecz/confctl/822c0e35dbe2549111912f539116b4225dfd3035#confctl
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  update:
    name: Update flake.lock
    if: github.repository == 'vpsfreecz/vpsadminos'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: cachix/install-nix-action@31.11.3

      - name: Restore confctl cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/confctl
          key: confctl-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            confctl-cache-${{ runner.os }}

      - name: Save lock baseline
        run: |
          cp flake.lock "$RUNNER_TEMP/flake-update-baseline.lock"
          echo "UPDATE_OLD_LOCK=$RUNNER_TEMP/flake-update-baseline.lock" >> "$GITHUB_ENV"

      - name: Update flake inputs
        run: |
          nix shell "$CONFCTL_FLAKE" -c confctl inputs update --forward-only --all

      - name: Commit and push changes
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No flake.lock changes."
            exit 0
          fi

          changed_inputs=$(ruby .github/workflows/scripts/flake-update-commit-message.rb inputs "$UPDATE_OLD_LOCK" flake.lock)
          changed_body=$(ruby .github/workflows/scripts/flake-update-commit-message.rb body "$UPDATE_OLD_LOCK" flake.lock)

          git add flake.lock
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          commit_file=$(mktemp)
          trap 'rm -f "$commit_file"' EXIT

          body_lines=$(printf '%s\n' "$changed_body" | sed '/^$/d' | wc -l | awk '{print $1}')
          if [ "$body_lines" -eq 1 ]; then
            single_line=$(printf '%s\n' "$changed_body" | head -n1 | sed 's/: / /')
            printf 'flake: %s\n' "$single_line" > "$commit_file"
          else
            if [ -n "$changed_inputs" ]; then
              commit_message="flake: update $changed_inputs"
            else
              commit_message="flake: update inputs"
            fi

            if [ -n "$changed_body" ]; then
              {
                printf '%s\n\n' "$commit_message"
                printf '%s\n' "$changed_body"
              } > "$commit_file"
            else
              printf '%s\n' "$commit_message" > "$commit_file"
            fi
          fi
          git commit -F "$commit_file"
          final_lock="$RUNNER_TEMP/flake-update-final.lock"
          git show HEAD:flake.lock > "$final_lock"
          nix shell "$CONFCTL_FLAKE" -c confctl inputs check-update \
            --old-lock "$UPDATE_OLD_LOCK" --new-lock "$final_lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Save confctl cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/confctl
          key: confctl-cache-${{ runner.os }}-${{ github.run_id }}
