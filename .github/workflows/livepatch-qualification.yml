name: Livepatch qualification

on:
  push:
    branches:
      - '**'
      - '!qualification-resume/**'
    paths:
      - .gitattributes
      - .github/workflows/livepatch.yml
      - .github/workflows/livepatch-qualification.yml
      - flake.nix
      - flake.lock
      - nix/flake/**
      - libosctl/**
      - os/default.nix
      - os/configs/qemu.nix
      - os/configs/tests.nix
      - os/livepatches/**
      - os/modules/config/kernel*.nix
      - os/modules/module-list.nix
      - os/modules/nixos-modules.nix
      - os/modules/os-modules.nix
      - os/modules/services/livepatches/**
      - os/modules/system/boot/qemu.nix
      - os/overlays/**
      - os/packages/kpatch-build/**
      - os/packages/linux/**
      - os/packages/livepatch-module/**
      - os/packages/ruby-source-gem-config.nix
      - os/packages/ruby/**
      - os/packages/zfs/**
      - osvm/**
      - test-runner.sh
      - test-runner/**
      - tests/all-tests.nix
      - tests/make-template.nix
      - tests/make-test.nix
      - tests/test-configs/ci.nix
      - tests/test-configs/livepatch-regression.nix
      - tests/configs/vpsadminos/base.nix
      - tests/configs/vpsadminos/livepatch*.nix
      - tests/machines/vpsadminos/**
      - tests/suite/kernel/livepatch*.nix
      - tests/suite/kernel/livepatch*/**
      - tests/suite/upgrade/impermanence-from-2abbe3cc1c10.nix
      - tools/livepatch/**
  workflow_dispatch:
    inputs:
      kernel_versions:
        description: Optional exact target kernels, one per line; empty runs the full campaign
        required: false
        type: string
        default: ''
      resume_source_run_id:
        description: Completed qualification source run ID
        required: false
        type: string
        default: ''
      resume_source_run_attempt:
        description: Completed qualification source run attempt
        required: false
        type: string
        default: ''
      resume_source_revision:
        description: Exact tested 40-hex source revision
        required: false
        type: string
        default: ''
      resume_plan_sha256:
        description: Exact source plan.json SHA-256
        required: false
        type: string
        default: ''
      resume_capture_sha256:
        description: Exact source capture.json SHA-256
        required: false
        type: string
        default: ''

permissions:
  actions: read
  contents: read

concurrency:
  group: livepatch-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    uses: ./.github/workflows/livepatch.yml
    with:
      kernel-versions: ${{ inputs.kernel_versions }}
      resume-source-run-id: ${{ inputs.resume_source_run_id }}
      resume-source-run-attempt: ${{ inputs.resume_source_run_attempt }}
      resume-source-revision: ${{ inputs.resume_source_revision }}
      resume-plan-sha256: ${{ inputs.resume_plan_sha256 }}
      resume-capture-sha256: ${{ inputs.resume_capture_sha256 }}
    secrets: inherit
