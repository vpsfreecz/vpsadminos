name: Build and test changed container images

on:
  push:
    paths:
      - .github/workflows/image-scripts.yml
      - image-scripts/**
  pull_request:
    paths:
      - .github/workflows/image-scripts.yml
      - image-scripts/**

env:
  NIX_PATH: nixpkgs=https://channels.nixos.org/nixos-25.05/nixexprs.tar.xz

jobs:
  build:
    name: Build OS and populate binary cache
    runs-on: self-hosted
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Determine branch name
        id: vars
        run: |
          echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT

      - name: Build toplevel closure
        run: |
          make toplevel
          echo "BUILD_OUT=$(readlink -f os/result/toplevel)" >> $GITHUB_ENV

      - name: Copy toplevel closure to binary cache
        env:
          VPSADMINOS_CACHE_SSH_KEY: ${{ secrets.VPSADMINOS_CACHE_SSH_KEY }}
        run: |
          install -m 600 -D <(echo "$VPSADMINOS_CACHE_SSH_KEY") .ssh/cache_id
          NIX_SSHOPTS="-i .ssh/cache_id -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" nix-copy-closure --to push@cache.int.vpsadminos.org "$BUILD_OUT"

      - name: Add new profile generation
        env:
          BRANCH: ${{ steps.vars.outputs.branch }}
        run: |
          ssh -i .ssh/cache_id \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              push@cache.int.vpsadminos.org \
              sudo push-ci-generation "$BRANCH" "$BUILD_OUT"
  
  detect:
    name: Detect changed image scripts
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      images: ${{ steps.set.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: set
        shell: bash
        run: |
          cat <<'RUBY' > /tmp/changed_images.rb
          require 'set'

          base = ENV.fetch('BASE_SHA')
          head = ENV.fetch('HEAD_SHA')

          # Fetch the base commit in case of a force-push
          `git fetch origin #{base}`

          git_diff = "git diff --name-only #{base} #{head}"
          warn "Running #{git_diff}"

          changed_files = `#{git_diff}`.split("\n")
          raise 'git diff failed' if $?.exitstatus != 0

          img_root = 'image-scripts/images'
          include_root = 'image-scripts/include'
          nixos_dir = 'os/lib/nixos-container'
          all_images = Dir.entries(img_root).reject { |v| %w[. ..].include?(v) }
          test_images = Set.new

          warn 'Changed files:'
          changed_files.each do |v|
            warn "- #{v}"
          end

          # Detect changes in image-scripts/images/
          changed_images = changed_files
                            .select { |v| File.fnmatch?("#{img_root}/*/*.sh", v) }
                            .map { |v| File.basename(File.dirname(v)) }
                            .to_set

          # Expand abstract images
          changed_images.each do |image|
            dir = File.join(img_root, image)
            
            if Dir.exist?(dir) && File.exist?(File.join(dir, 'abstract'))
              all_images.each do |other_image|
                begin
                  test_images << other_image if File.readlink(File.join(img_root, other_image)).strip == image
                rescue Errno::EINVAL
                  next
                end
              end
            else
              test_images << image
            end
          end

          # Special case for NixOS
          if changed_files.any? { |v| v.start_with?("#{nixos_dir}/") }
            all_images.each do |image|
              test_images << image if image.start_with?('nixos-')
            end
          end

          # Detect changes in image-scripts/include
          includes_modified = changed_files.select { |v| v.start_with?("#{include_root}/") }

          if includes_modified.any?
            Dir.glob("#{img_root}/*/*.sh").each do |script|
              File.open(script) do |f|
                f.each_line do |line|
                  found = false

                  includes_modified.each do |modified|
                    next unless line.include?(File.basename(modified))

                    test_images << File.basename(File.dirname(script))
                    found = true
                    break
                  end

                  break if found
                end
              end
            end
          end

          puts test_images.to_a.sort.join(',')
          RUBY

          BASE_SHA=$(jq -r '.before // .pull_request.base.sha' "$GITHUB_EVENT_PATH")
          HEAD_SHA=$GITHUB_SHA

          images=$(BASE_SHA="$BASE_SHA" HEAD_SHA="$HEAD_SHA" ruby /tmp/changed_images.rb)
          echo "Detected images: $images"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  test:
    name: Build and test changed images
    needs: detect
    if: ${{ needs.detect.outputs.images != '' }}
    runs-on: self-hosted
    timeout-minutes: 86400
    steps:
      - uses: actions/checkout@v4

      - name: Determine job count
        id: determine-test-jobs
        uses: ./.github/actions/determine-test-jobs

      - name: Build and test images
        run: |
          set -o pipefail
          ./test-runner.sh test -j "${{ steps.determine-test-jobs.outputs.jobs }}" "image-scripts/test@{${{ needs.detect.outputs.images }}}" | tee test.log
      
      - name: Evaluate test results
        if: always()
        run: |
          EXPECTED_SUCCESSFUL=$(grep -oP "\d+ tests successful" test.log | cut -f1 -d ' ')
          EXPECTED_FAILED=$(grep -oP "\d+ tests failed as expected" test.log | cut -f1 -d ' ')
          UNEXPECTED_FAILED=$(grep -oP "\d+ tests should have succeeded" test.log | cut -f1 -d ' ')
          UNEXPECTED_SUCCESSFUL=$(grep -oP "\d+ tests should have failed" test.log | cut -f1 -d ' ')

          echo "expected_successful=${EXPECTED_SUCCESS:-0}" >> $GITHUB_OUTPUT
          echo "expected_failed=${EXPECTED_FAILED:-0}" >> $GITHUB_OUTPUT
          echo "unexpected_failed=${UNEXPECTED_FAILED:-0}" >> $GITHUB_OUTPUT
          echo "unexpected_successful=${UNEXPECTED_SUCCESSFUL:-0}" >> $GITHUB_OUTPUT

          {
            echo '### Test summary'
            echo ""
            echo "| Result | Count |"
            echo "|--------|-------|"
            echo "| ✅ Successful (expected) | ${EXPECTED_SUCCESSFUL:-0} |"
            echo "| ⚠️ Failed (expected) | ${EXPECTED_FAILED:-0} |"
            echo "| ❌ Failed (unexpected) | ${UNEXPECTED_FAILED:-0} |"
            echo "| ❌ Successful (unexpected) | ${UNEXPECTED_SUCCESSFUL:-0} |"
            echo ""
          } >> $GITHUB_STEP_SUMMARY

          if [ "${UNEXPECTED_FAILED:-0}" -gt 0 ] || [ "${UNEXPECTED_SUCCESSFUL:-0}" -gt 0 ]; then
            echo "::error::${UNEXPECTED_FAILED:-0} tests unexpectedly failed, ${UNEXPECTED_SUCCESSFUL:-0} tests unexpectedly succeeded"
            exit 1
          fi

      - name: Summarise test logs
        if: always()
        run: |
          summary_file="$GITHUB_STEP_SUMMARY"
          logs_root=/tmp/os-test-runner

          if [ -d "$logs_root" ]; then
            echo "## Per-test logs (tail, last 200 lines each)" >>"$summary_file"
            echo >>"$summary_file"

            # One collapsible <details> section per test
            for test_dir in "$logs_root"/os-test-*; do
              test_name=$(basename "$test_dir")
              result_file="$test_dir"/test-result.txt

              [ -e "$result_file" ] || continue

              test_result=$(cat "$test_dir"/test-result.txt)

              if [ "$test_result" == "expected_success" ] || [ "$test_result" == "expected_failure" ]; then
                continue
              fi

              echo "<details><summary><code>$test_name</code></summary>" >>"$summary_file"
              echo >>"$summary_file"

              for f in "$test_dir"/*.log; do
                echo "#### $(basename "$f")" >>"$summary_file"
                echo '```' >>"$summary_file"
                tail -n 200 "$f" >>"$summary_file"
                echo '```' >>"$summary_file"
                echo >>"$summary_file"
              done

              echo '</details>' >>"$summary_file"
              echo >>"$summary_file"
            done
          fi

      - name: Upload full test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: os-test-logs-${{ github.run_id }}
          path: |
            /tmp/os-test-runner/**/*.log
            /tmp/os-test-runner/**/*.txt
          retention-days: 14
          if-no-files-found: ignore
