name: Weekly kernel retention

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-retention-staging
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'vpsfreecz/vpsadminos' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      base: ${{ steps.prepare.outputs.base }}
      candidate: ${{ steps.prepare.outputs.candidate }}
    env:
      KERNEL_RETENTION_WRITE: ${{ vars.KERNEL_RETENTION_WRITE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/staging
          fetch-depth: 0
          persist-credentials: false
      - name: Run offline fixtures
        run: python3 -B -m unittest discover -s tools/kernel_retention_tests -v
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - name: Prepare locked inputs and lightweight verification tools
        run: |
          nix flake archive --no-write-lock-file
          if [[ "$KERNEL_RETENTION_WRITE" == true ]]; then
            hook_ruby=$(nix eval --offline --raw --inputs-from . nixpkgs#overcommit.wrappedRuby \
              --apply 'package: package.outPath')/bin/ruby
            nix shell --inputs-from . nixpkgs#overcommit.wrappedRuby nixpkgs#overcommit \
              nixpkgs#nixfmt nixpkgs#rubocop nixpkgs#mkdocs \
              --command bash -eu -c '
                printf "Ruby on PATH: %s\nHook Ruby: %s\n" "$(command -v ruby)" "$1"
                "$1" -rovercommit -e "puts Overcommit::VERSION"
                overcommit --install
                overcommit --sign
                "$1" .github/workflows/scripts/kernel_retention_bind_hooks.rb "$1"
              ' bash "$hook_ruby"
          fi
      - name: Plan and, only when enabled, verify one local candidate
        id: prepare
        run: |
          if [[ "$KERNEL_RETENTION_WRITE" == true ]]; then
            nix shell --offline --inputs-from . nixpkgs#overcommit.wrappedRuby nixpkgs#overcommit \
              nixpkgs#nixfmt nixpkgs#rubocop nixpkgs#mkdocs \
              --command bash .github/workflows/scripts/kernel-retention-prepare.sh
          else
            bash .github/workflows/scripts/kernel-retention-prepare.sh
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.prepare.outputs.candidate != ''
        with:
          name: kernel-retention-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kernel-retention/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    if: >-
      github.repository == 'vpsfreecz/vpsadminos' && github.ref == 'refs/heads/staging' &&
      vars.KERNEL_RETENTION_WRITE == 'true' && needs.prepare.outputs.candidate != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-retention-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kernel-retention/
      - name: Admit the exact candidate and recheck fleet before fast-forward
        env:
          BASE: ${{ needs.prepare.outputs.base }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          KERNEL_RETENTION_WRITE: ${{ vars.KERNEL_RETENTION_WRITE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        run: bash .github/workflows/scripts/kernel-retention-publish.sh
