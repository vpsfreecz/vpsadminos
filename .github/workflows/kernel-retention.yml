name: Weekly kernel retention

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-retention-no-overcommit-validation
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'vpsfreecz/vpsadminos' &&
      github.ref == 'refs/heads/2026-11-23-kernel-retention-no-overcommit-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      base: ${{ steps.prepare.outputs.base }}
      candidate: ${{ steps.prepare.outputs.candidate }}
    env:
      KERNEL_RETENTION_WRITE: ${{ vars.KERNEL_RETENTION_WRITE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 593eaef3f1b7ce6a0ea4fc9a61cdeb8b0c664d57
          fetch-depth: 0
          persist-credentials: false
      - name: Run offline fixtures
        run: python3 -B -m unittest discover -s tools/kernel_retention_tests -v
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - name: Prepare locked inputs and lightweight verification tools
        run: |
          nix flake archive --no-write-lock-file
          if [[ "$KERNEL_RETENTION_WRITE" == true ]]; then
            nix shell --inputs-from . nixpkgs#mkdocs --command true
          fi
      - name: Plan and, only when enabled, verify one local candidate
        id: prepare
        run: |
          if [[ "$KERNEL_RETENTION_WRITE" == true ]]; then
            nix shell --offline --inputs-from . nixpkgs#mkdocs \
              --command bash .github/workflows/scripts/kernel-retention-prepare.sh
          else
            bash .github/workflows/scripts/kernel-retention-prepare.sh
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.prepare.outputs.candidate != ''
        with:
          name: kernel-retention-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kernel-retention/
          if-no-files-found: error
          retention-days: 1
