name: libosctl RSpec

on:
  push:
    paths:
      - .github/workflows/libosctl-rspec.yml
      - .ruby-version
      - flake.nix
      - flake.lock
      - os/overlays/osctl.nix
      - os/overlays/ruby.nix
      - os/packages/ruby/**
      - libosctl/**
  pull_request:
    paths:
      - .github/workflows/libosctl-rspec.yml
      - .ruby-version
      - flake.nix
      - flake.lock
      - os/overlays/osctl.nix
      - os/overlays/ruby.nix
      - os/packages/ruby/**
      - libosctl/**

concurrency:
  group: libosctl-rspec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rspec:
    name: libosctl RSpec
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.vpsadminos.org
            extra-trusted-public-keys = cache.vpsadminos.org:wpIJlNZQIhS+0gFf1U3MC9sLZdLW3sh5qakOWGDoDrE=
            fallback = true
            connect-timeout = 15

      - name: Run RSpec
        run: |
          nix develop .#vpsadminos -c bash -lc '
            set -euo pipefail

            export BUNDLE_GEMFILE="$GITHUB_WORKSPACE/libosctl/Gemfile"
            export BUNDLE_PATH="$GITHUB_WORKSPACE/.gems/libosctl"

            cd "$GITHUB_WORKSPACE/libosctl"
            bundle install
            bundle exec rake compile
            bundle exec rspec \
              --format progress \
              --profile 10
          '
