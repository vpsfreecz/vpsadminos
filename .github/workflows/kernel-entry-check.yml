name: Kernel entry check

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-entry-correctness:
    name: kernel-entry-correctness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR validation needs the merge commit and its staging parent.
          # Dispatch must prove ancestry against the current staging tip.
          fetch-depth: ${{ github.event_name == 'pull_request' && '2' || '0' }}
          persist-credentials: false
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - name: Check candidate kernel entries
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base="$PR_BASE"
              test "$(git rev-parse HEAD^1)" = "$base"
              ;;
            workflow_dispatch)
              # No caller-supplied base; this is the current upstream staging.
              git fetch --no-tags origin refs/heads/staging
              base=$(git rev-parse FETCH_HEAD)
              ;;
            *) exit 1 ;;
          esac
          python3 tools/kernel-entry-check.py check \
            --as-of "$(date -u +%F)" --base "$base" --tree "$GITHUB_SHA"
